    cRef.on('value', async s => {
      const list = await Promise.all(Object.keys(s.val() || {}).map(async id => {
        const v = (await db.ref('classes/' + id).once('value')).val();
        return v ? { id, name: v.name, teacherName: v.teacherName || '', tests: Object.entries(v.assignments || {}).map(([roomId, a]) => ({ roomId, ...a })) } : null;
      }));
      setClasses(list.filter(Boolean));
    });
    return () => { aRef.off(); cRef.off(); };
  }, [uidv]);
  const join = async () => {
    const db = getDb();
    try {
      const cid = (await db.ref('classCodes/' + code.trim().toUpperCase()).once('value')).val();
      if (!cid) return alert('Ангийн код буруу байна');
      await db.ref('classMembers/' + cid + '/' + uidv).set({ name, at: new Date().toISOString() });
      await db.ref('studentClasses/' + uidv + '/' + cid).set(true);
      setCode('');
    } catch (e) { alert('Нэгдэх алдаа: ' + (e.message || e)); }
  };
  const tests = classes.flatMap(c => c.tests.map(t => ({ ...t, cls: c })));
  const start = async (t, onlyIds, label) => {
    setBusy(true);
    try {
      const room = await fetchExamRoomByCode(t.roomId);
      if (room.stopped) throw new Error('Энэ тестийг багш зогсоосон байна.');
      const isExamKind = t.kind !== 'practice';
      const doneFull = sortedAttempts(att[t.roomId]).filter(a => a.mode !== 'mistakes').length;
      let st0 = selSet;
      try { st0 = (await roomRef(getDb(), t.roomId).child('settings').once('value')).val() || selSet || {}; } catch (_) {}
      const cap = st0?.maxAttempts > 0 ? st0.maxAttempts : (room.maxAttempts > 0 ? room.maxAttempts : 0);
      // Шалгалт: багшийн заасан бүх оролдлогоо дуусгахаас өмнө алдсан асуулт руу орохгүй
      if (onlyIds && isExamKind) {
        if (cap > 0 && doneFull < cap) throw new Error('Эхлээд бүх ' + cap + ' оролдлогоо бүтнээр нь дуусгана уу (' + doneFull + '/' + cap + ').');
        if (doneFull < 1) throw new Error('Эхлээд шалгалтаа бүтнээр нь өгч дуусгана уу.');
      }
      // Дасгал: оролдлогын дээд тоо хэтэрсэн бол бүтнээр нь дахин өгөхгүй
      if (!onlyIds && !isExamKind && cap > 0 && doneFull >= cap) throw new Error('Оролдлогын дээд тоо (' + cap + ') хэтэрсэн байна.');
      if (!onlyIds && isExamKind && cap > 0 && doneFull >= cap) {
        if (!confirm('⚠️ Та энэ шалгалтын ' + cap + ' оролдлогоо бүгдийг ашигласан байна.\n\nЭнэ удаагийн дүн ТООЦОГДОХГҮЙ (зөвхөн дадлага). Багшид харагдах эцсийн дүн (хамгийн өндөр) өөрчлөгдөхгүй.\n\nҮргэлжлүүлэх үү?')) { setBusy(false); return; }
      }
      const exam0 = label ? buildExamWithVariant(room, label) : await pickVariantForStudent(room, name, t.cls.name);
      // Шалгалтын бүх оролдлого дууссаны дараах бүтэн дахин өгөлт — дүнд тооцогдохгүй (дасгал горим)
      const extraFull = !onlyIds && isExamKind && cap > 0 && doneFull >= cap;
      onStart(prepareAttempt(exam0, extraFull ? (exam0.questions || []).map(q => q.id) : onlyIds, extraFull), { classId: t.cls.id, kind: t.kind });
    } catch (e) { alert(e.message || 'Алдаа'); }
    setBusy(false);
  };
  const list = sel ? sortedAttempts(att[sel.roomId]) : [];
  const last = list[list.length - 1];
  const wrong = last?.wrongIds || [];
  // Firebase хоосон жагсаалтыг хадгалдаггүй тул 100% оролдлого wrongIds-гүй ирнэ — алдаагүй гэж үзнэ
  const noMistakes = !!last && (Array.isArray(last.wrongIds) ? last.wrongIds.length === 0 : (last.total > 0 && last.correct >= last.total));
  const maxA = selSet?.maxAttempts || 0;
  const fullN = list.filter(a => a.mode !== 'mistakes').length;
  const isExamSel = !!sel && sel.kind !== 'practice';
  const capSel = maxA > 0 ? maxA : 0;
  const limitReached = capSel > 0 && fullN >= capSel;
  const mistakesLocked = isExamSel && capSel > 0 && !limitReached;
  return (
    <div className="container-sm" style={{ paddingTop: 16, paddingBottom: 40 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <h2>📚 Тест & Миний алдаа</h2><button className="btn btn-ghost btn-sm" onClick={onLogout}>Гарах</button>
      </div>
      <div className="card" style={{ marginBottom: 14 }}><div className="card-body" style={{ display: 'flex', gap: 8 }}>
        <input className="form-input" placeholder="Ангийн код (багшаас авна)" value={code} onChange={e => setCode(e.target.value)} />
        <button className="btn btn-violet" onClick={join} disabled={!code.trim()}>Нэгдэх</button>
      </div></div>
      {!tests.length && <div style={{ color: 'var(--text2)' }}>Одоогоор тест алга. Багшийн өгсөн ангийн кодоор ангидаа нэгдээрэй.</div>}
      {tests.map(t => {
        const l = sortedAttempts(att[t.roomId]); const lw = l[l.length - 1]?.wrongIds;
        return (
          <div key={t.cls.id + t.roomId} className="exam-card" style={{ marginBottom: 10, cursor: 'pointer' }} onClick={() => { setSel(t); setChoose(false); }}>
            <div className="exam-card-title">{t.title}</div>
            <div className="exam-card-meta"><span>{t.cls.name}</span>
              <span className={'badge ' + (t.kind === 'practice' ? 'badge-green' : 'badge-blue')}>{t.kind === 'practice' ? 'Дасгал' : 'Шалгалт'}</span>
              {t.cls.teacherName && <span>👤 {t.cls.teacherName} багшийн шалгалт</span>}
              <span>{l.length} удаа өгсөн</span>
              {l.length > 0 && <span>Сүүлд: <b>{l[l.length - 1].score}%</b></span>}
              {lw && lw.length > 0 && <span className="badge badge-red">❌ {lw.length} алдсан</span>}</div>
          </div>
        );
      })}
      {sel && (
        <div className="modal-overlay" onClick={() => setSel(null)}><div className="modal" onClick={e => e.stopPropagation()} style={{ maxWidth: 520 }}>
          <div className="modal-body">
            <h3 style={{ marginBottom: 4 }}>{sel.title}</h3>
            {sel.cls?.teacherName && <div style={{ fontSize: '0.85rem', color: 'var(--text2)', marginBottom: 10 }}>👤 {sel.cls.teacherName} багшийн шалгалт</div>}
            {list.length > 0 ? (
              <div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>#</th><th>Огноо</th><th>Хугацаа</th><th>Дүн</th><th>Төрөл</th></tr></thead><tbody>
                {list.map((a, i) => <tr key={a.id}><td>{i + 1}</td><td>{fmtDate(a.at)}</td><td>{fmtDur(a.sec)}</td>
                  <td><b>{a.score}%</b> ({a.correct}/{a.total})</td><td>{a.extra ? <span className="badge badge-red">Дүнд тооцохгүй</span> : a.mode === 'mistakes' ? 'Алдсан' : 'Бүгд'}</td></tr>)}
              </tbody></table></div>
            ) : <div style={{ color: 'var(--text2)' }}>Та энэ тестийг хараахан өгөөгүй байна.</div>}
            <div style={{ marginTop: 14, display: 'flex', gap: 8, flexWrap: 'wrap' }}>
              {isExamSel && <div className="form-hint" style={{ width: '100%' }}>Багшийн заасан бүх оролдлогоо бүтнээр нь дуусгасны дараа алдсан асуултаа болон шалгалтыг дахин өгч болно (дахин өгөлт нь дүнд нөлөөлөхгүй).</div>}
              {isExamSel && capSel > 0 && !limitReached && <div className="form-hint" style={{ width: '100%' }}>Үлдсэн оролдлого: <b>{capSel - fullN}</b> · Дүнд хамгийн өндөр оноо тооцогдоно.</div>}
              {isExamSel && limitReached && <div className="form-hint" style={{ width: '100%', color: 'var(--red)', fontWeight: 600 }}>⚠️ Бүх {capSel} оролдлого дууссан. Одооноос дахин өгвөл дүнд ТООЦОГДОХГҮЙ (зөвхөн дадлага).</div>}
              {capSel > 0 && <div className="form-hint" style={{ width: '100%' }}>Бүтэн оролдлого: {fullN}/{capSel}{limitReached ? ' — бүгдийг дуусгасан (алдсан асуулт, шалгалтыг дахин өгч болно)' : ''}</div>}
              {!list.length && <button className="btn btn-primary" disabled={busy} onClick={() => start(sel)}>▶ Эхлэх</button>}
              {list.length > 0 && !choose && <button className="btn btn-primary" onClick={() => setChoose(true)}>🔁 Дахин шалгалт өгөх</button>}
              {choose && <>
                {!mistakesLocked && <button className="btn btn-violet" disabled={busy || !wrong.length} onClick={() => start(sel, wrong, last.variant)}>
                  ❌ Алдсан асуултуудыг дахин ({wrong.length})</button>}
                <button className="btn btn-outline" disabled={busy || (!isExamSel && limitReached)} onClick={() => start(sel, null, last.variant)}>↻ Дахин эхнээс нь{isExamSel && limitReached ? ' (дүнд тооцохгүй)' : ''}</button>
              </>}
              <button className="btn btn-ghost" onClick={() => setSel(null)}>Хаах</button>
            </div>
            {choose && !last?.wrongIds && !noMistakes && <div className="form-hint">Алдсан асуултын мэдээлэл серверээс ирэхгүй байна (gradeSubmission-д wrongIds нэмэх шаардлагатай).</div>}
            {choose && noMistakes && <div className="form-hint">Сүүлийн оролдлого {last.score}% — алдсан асуулт алга 🎉 (алдсан асуултыг зөвхөн сүүлийн оролдлогын алдаанаас авна)</div>}
          </div>
        </div></div>
      )}
    </div>
  );
}

function ClassesPage({ exams, onBack }) {
  const [classes, setClasses] = useState([]);
  const [cur, setCur] = useState(null);
  const [members, setMembers] = useState({});
  const [results, setResults] = useState({});
  const [name, setName] = useState('');
  const [pick, setPick] = useState({ exam: '', kind: 'exam' });
  const uidv = getAuth()?.currentUser?.uid;
  useEffect(() => {
    const db = getDb(); if (!db || !uidv) return;
    const r = db.ref('classes').orderByChild('teacherUid').equalTo(uidv);
    r.on('value', s => {
      const list = Object.entries(s.val() || {}).map(([id, v]) => ({ id, ...v }));
      setClasses(list);
      // Сурагчид багшийн нэрийг харуулахын тулд ангид нэрийг хадгална (хуучин ангиудыг нөхнө)
      const tn = getAuth()?.currentUser?.displayName || localStorage.getItem(SE_TEACHER);
      if (tn) list.forEach(c => { if (c.teacherName !== tn) db.ref('classes/' + c.id + '/teacherName').set(tn).catch(() => {}); });
    });
    return () => r.off();
  }, [uidv]);
  useEffect(() => {
    if (!cur) return; const db = getDb();
    const m = db.ref('classMembers/' + cur), r = db.ref('classResults/' + cur);
    m.on('value', s => setMembers(s.val() || {})); r.on('value', s => setResults(s.val() || {}));
    return () => { m.off(); r.off(); };
  }, [cur]);
  const create = async () => {
    const db = getDb(), id = uid();
    const code = Array.from({ length: 6 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random() * 32)]).join('');
    await db.ref('classes/' + id).set({ name: sanitizeText(name, 60), teacherUid: uidv, teacherName: getAuth()?.currentUser?.displayName || localStorage.getItem(SE_TEACHER) || '', code, createdAt: new Date().toISOString() });
    await db.ref('classCodes/' + code).set(id); setName('');
  };
  const addTest = async () => {
    const ex = exams.find(e => e.id === pick.exam); if (!ex) return;
    await getDb().ref('classes/' + cur + '/assignments/' + ex.id).set({ title: ex.title, kind: pick.kind, at: new Date().toISOString() });
  };
  const c = classes.find(x => x.id === cur);
  const tests = Object.entries(c?.assignments || {});
  const modeOf = (rid) => exams.find(e => e.id === rid)?.scoreMode || 'best';
  const cell = (rid, sid) => { const all = sortedAttempts(results[rid]?.[sid]); if (!all.length) return null;
    const full = all.filter(a => a.mode !== 'mistakes'); const base = full.length ? full : all; const m = modeOf(rid);
    const val = m === 'avg' ? Math.round(base.reduce((t, a) => t + a.score, 0) / base.length)
      : m === 'last' ? base[base.length - 1].score : Math.max(...base.map(a => a.score));
    return { val, last: all[all.length - 1].score, n: all.length, all }; };
  const [detail, setDetail] = useState(null);
  const mIds = Object.keys(members);

  // Ангийн дүнг Excel (.xlsx) болгон татах: 1) нэгтгэл 2) оролдлого бүрийн дэлгэрэнгүй
  const exportExcel = () => {
    if (!c || !mIds.length) { alert('Сурагч алга байна'); return; }
    const modeTxt = { best: 'өндөр', avg: 'дундаж', last: 'сүүлийн' };
    const head = ['№', 'Сурагч', ...tests.map(([rid, t]) => t.title + ' (' + (t.kind === 'practice' ? 'дасгал' : 'шалгалт') + ' · ' + modeTxt[modeOf(rid)] + ') %'), 'Дундаж %'];
    const sorted = [...mIds].sort((a, b) => String(members[a].name || '').localeCompare(String(members[b].name || ''), 'mn'));
    const rows = [head];
    sorted.forEach((sid, i) => {
      const cs = tests.map(([rid]) => cell(rid, sid)); const got = cs.filter(Boolean);
      rows.push([i + 1, members[sid].name || '', ...cs.map(x => x ? x.val : ''), got.length ? Math.round(got.reduce((t, x) => t + x.val, 0) / got.length) : '']);
    });
    rows.push(['', 'Ангийн дундаж', ...tests.map(([rid]) => { const v = mIds.map(sd => cell(rid, sd)).filter(Boolean); return v.length ? Math.round(v.reduce((t, x) => t + x.val, 0) / v.length) : ''; }), '']);
    rows.push(['', 'Өгсөн сурагч', ...tests.map(([rid]) => mIds.filter(sd => cell(rid, sd)).length + '/' + mIds.length), '']);
    const det = [['Сурагч', 'Тест', 'Оролдлого №', 'Огноо', 'Төрөл', 'Дүн %', 'Хугацаа']];
    sorted.forEach(sid => tests.forEach(([rid, t]) => { const x = cell(rid, sid); if (!x) return;
      x.all.forEach((a, i) => det.push([members[sid].name || '', t.title, i + 1, fmtDate(a.at), a.extra ? 'Нэмэлт (дүнд тооцохгүй)' : a.mode === 'mistakes' ? 'Алдсан асуулт' : 'Бүгд', a.score, fmtDur(a.sec || 0)]));
    }));
    const base = 'SmartEXAM_' + String(c.name || 'angi').replace(/[\\\/:*?"<>|\s]+/g, '_');
    if (typeof XLSX !== 'undefined') {
      const wb = XLSX.utils.book_new();
      const w1 = XLSX.utils.aoa_to_sheet(rows);
      w1['!cols'] = head.map((h, i) => ({ wch: i === 1 ? 24 : i === 0 ? 5 : 22 }));
      XLSX.utils.book_append_sheet(wb, w1, 'Дүн');
      const w2 = XLSX.utils.aoa_to_sheet(det);
      w2['!cols'] = [{ wch: 24 }, { wch: 26 }, { wch: 12 }, { wch: 18 }, { wch: 22 }, { wch: 8 }, { wch: 10 }];
      XLSX.utils.book_append_sheet(wb, w2, 'Оролдлогууд');
      XLSX.writeFile(wb, base + '.xlsx');
    } else {
      downloadCSV(base, rows);
    }
  };
  return (
    <div className="container-lg" style={{ paddingTop: 16, paddingBottom: 40 }}>
      <button className="btn btn-ghost btn-sm" onClick={cur ? () => setCur(null) : onBack}>← Буцах</button>
      {!c ? (<>
        <h2 style={{ margin: '10px 0' }}>👥 Миний ангиуд</h2>
        <div className="card" style={{ marginBottom: 14 }}><div className="card-body" style={{ display: 'flex', gap: 8 }}>
          <input className="form-input" placeholder="Шинэ ангийн нэр (жнь: 12А)" value={name} onChange={e => setName(e.target.value)} />
          <button className="btn btn-primary" disabled={!name.trim()} onClick={create}>Анги үүсгэх</button></div></div>
        {classes.map(x => <div key={x.id} className="exam-card" style={{ marginBottom: 10, cursor: 'pointer' }} onClick={() => setCur(x.id)}>
          <div className="exam-card-title">{x.name}</div><div className="exam-card-meta"><span>Код: <b>{x.code}</b></span></div></div>)}
      </>) : (<>
        <h2 style={{ margin: '10px 0' }}>{c.name} <span className="badge badge-violet">Код: {c.code}</span></h2>
        <div className="card" style={{ marginBottom: 14 }}><div className="card-body">
          <div className="form-label">Тест / дасгал оноох</div>
          <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
            <select className="form-select" style={{ flex: 1, minWidth: 160 }} value={pick.exam} onChange={e => setPick(p => ({ ...p, exam: e.target.value }))}>
              <option value="">— тест сонгох —</option>{exams.map(e => <option key={e.id} value={e.id}>{e.title}</option>)}</select>
            <select className="form-select" style={{ width: 130 }} value={pick.kind} onChange={e => setPick(p => ({ ...p, kind: e.target.value }))}>
              <option value="exam">Шалгалт</option><option value="practice">Дасгал</option></select>
            <button className="btn btn-primary" disabled={!pick.exam} onClick={addTest}>Нэмэх</button></div>
          <div className="form-hint">Оролдлогын тоо болон дүн тооцох горимыг (өндөр / дундаж / сүүлийн) тест үүсгэхдээ сонгоно.</div></div></div>
        <div className="card"><div className="card-header"><div className="card-title">📊 Дүн ({mIds.length} сурагч)</div>
            <button className="btn btn-green btn-sm" style={{ marginLeft: 'auto' }} disabled={!mIds.length} onClick={exportExcel}>📥 Excel татах</button></div>
          <div className="card-body" style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>Сурагч</th>
            {tests.map(([rid, t]) => <th key={rid}>{t.title}<div style={{ fontWeight: 400, fontSize: '0.7rem' }}>{t.kind === 'practice' ? 'дасгал' : 'шалгалт'} · {({ best: 'өндөр', avg: 'дундаж', last: 'сүүлийн' })[modeOf(rid)]}</div></th>)}<th>Дундаж</th><th></th></tr></thead><tbody>
            {mIds.map(sid => { const cs = tests.map(([rid]) => cell(rid, sid)); const got = cs.filter(Boolean);
              return <tr key={sid}><td><a style={{ cursor: 'pointer', color: 'var(--primary)', fontWeight: 600 }} onClick={() => setDetail(sid)}>{members[sid].name}</a></td>
                {cs.map((x, i) => <td key={i}>{x ? <><b>{x.val}%</b> <span style={{ color: 'var(--text3)', fontSize: '0.75rem' }}>({x.n}×)</span></> : '—'}</td>)}
                <td><b>{got.length ? Math.round(got.reduce((s, x) => s + x.val, 0) / got.length) : '—'}{got.length ? '%' : ''}</b></td>
                <td><button className="btn btn-red btn-sm" onClick={async () => { if (!confirm('Ангиас хасах уу?')) return; const db = getDb(); await db.ref('classMembers/' + cur + '/' + sid).remove(); db.ref('studentClasses/' + sid + '/' + cur).remove().catch(() => {}); }}>Хасах</button></td></tr>; })}
            <tr style={{ background: 'var(--surface2)' }}><td><b>Ангийн дундаж</b></td>{tests.map(([rid]) => { const v = mIds.map(s => cell(rid, s)).filter(Boolean);
              return <td key={rid}><b>{v.length ? Math.round(v.reduce((s, x) => s + x.val, 0) / v.length) + '%' : '—'}</b> <span style={{ fontSize: '0.75rem', color: 'var(--text3)' }}>{v.length}/{mIds.length} өгсөн</span></td>; })}<td></td><td></td></tr>
          </tbody></table></div></div>
      </>)}
      {detail && members[detail] && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setDetail(null)}>
          <div className="modal" style={{ maxWidth: 560 }}>
            <div className="modal-head"><div style={{ fontFamily: 'Outfit', fontWeight: 800, fontSize: '1.1rem' }}>👤 {members[detail].name}</div>
              <div style={{ fontSize: '0.8rem', color: 'var(--text2)' }}>{c?.name} · дэлгэрэнгүй дүн</div></div>
            <div className="modal-body" style={{ maxHeight: '60vh', overflowY: 'auto' }}>
              {tests.map(([rid, t]) => { const x = cell(rid, detail);
                return (
                  <div key={rid} style={{ marginBottom: 14 }}>
                    <div style={{ fontWeight: 700 }}>{t.title} <span style={{ fontWeight: 400, color: 'var(--text2)', fontSize: '0.8rem' }}>· {SCORE_MODE_LABEL[modeOf(rid)]}</span></div>
                    {!x ? <div style={{ color: 'var(--text3)', fontSize: '0.85rem' }}>Өгөөгүй</div> : (<>
                      <div style={{ margin: '4px 0' }}>Эцсийн дүн: <b>{x.val}%</b> · {x.n} оролдлого</div>
                      <div style={{ overflowX: 'auto' }}><table className="tbl"><thead><tr><th>#</th><th>Огноо</th><th>Төрөл</th><th>Дүн</th><th>Хугацаа</th></tr></thead><tbody>
                        {x.all.map((a, i) => <tr key={a.id}><td>{i + 1}</td><td>{fmtDate(a.at)}</td><td>{a.extra ? 'Нэмэлт (дүнд тооцохгүй)' : a.mode === 'mistakes' ? 'Алдсан асуулт' : 'Бүгд'}</td><td><b>{a.score}%</b></td><td>{fmtDur(a.sec || 0)}</td></tr>)}
                      </tbody></table></div></>)}
                  </div>); })}
            </div>
            <div className="modal-foot"><button className="btn btn-primary" onClick={() => setDetail(null)}>Хаах</button></div>
          </div>
        </div>
      )}
    </div>
  );
}

// Багшийн тестүүдийг Firebase-ээс сэргээх (localStorage хоосорсон/өөр файлаас нээсэн үед)
// Эх сурвалж: (1) users/{uid}/exams индекс, (2) ангид оноосон тестүүд, (3) activeRooms-ийг ownerUid-ээр лавлах (дүрэм зөвшөөрвөл)
const restoreExamsFromCloud = async () => {
  const db = getDb(), teacher = ensureTeacherAuth();
  if (!db) throw new Error('Firebase холбогдоогүй. Интернетээ шалгана уу.');
  if (!teacher) throw new Error('Багшаар нэвтэрсэн байх ёстой. Гараад дахин нэвтэрч орно уу.');
  const ids = new Set();
  const notes = [];
  try {
    const v = (await db.ref('users/' + teacher.uid + '/exams').once('value')).val() || {};
    Object.keys(v).forEach(id => ids.add(id));
  } catch (e) { notes.push('users'); }
  try {
    const v = (await db.ref('classes').orderByChild('teacherUid').equalTo(teacher.uid).once('value')).val() || {};
    Object.values(v).forEach(c => Object.keys(c.assignments || {}).forEach(id => ids.add(id)));
  } catch (e) { notes.push('classes'); }
  try {
    const v = (await db.ref('activeRooms').orderByChild('ownerUid').equalTo(teacher.uid).once('value')).val() || {};
    Object.keys(v).forEach(id => ids.add(id));
  } catch (e) { notes.push('rooms'); }

  const out = [];
  await Promise.all([...ids].map(async (rid) => {
    try {
      const ref = db.ref('activeRooms/' + rid);
      const [packS, keysS, setS] = await Promise.all([
        ref.child('clientPack').once('value'),
        ref.child('answerKeys').once('value').catch(() => null),
        ref.child('settings').once('value').catch(() => null)
      ]);
      const pack = packS.val();
      if (!pack || !pack.versions) return;
      if (pack.ownerUid && pack.ownerUid !== teacher.uid) return;
      const keys = (keysS && keysS.val()) || {};
      const st = (setS && setS.val()) || {};
      const variants = Object.keys(pack.versions).map((label) => {
        const pubList = Array.isArray(pack.versions[label]) ? pack.versions[label] : Object.values(pack.versions[label] || {});
        const keyList = Array.isArray(keys[label]) ? keys[label] : Object.values(keys[label] || {});
        const questions = pubList.map((q, i) => {
          const k = keyList[i] || {};
          const type = q.type || k.type || 'mcq';
          const ans = k.answer ?? null;
          return {
            id: i + 1, text: q.text || '', type, topic: q.topic || '',
            options: Array.isArray(q.options) ? q.options : Object.values(q.options || {}),
            left: type === 'match' ? (Array.isArray(q.left) ? q.left : Object.values(q.left || {})) : [],
            answer: ans, numericAnswer: type === 'grid' ? ans : null,
            imageUrl: q.imageUrl || '', sourceText: q.sourceText || '', audioUrl: q.audioUrl || '', unit: q.unit || ''
          };
        });
        return { label, questions };
      });
      out.push({
        id: rid, title: pack.title || 'Шалгалт', subject: pack.subject || '', subjectId: pack.subjectId || '',
        duration: pack.duration || 45, passingScore: pack.passingScore ?? 60,
        omrFormat: pack.omrFormat || 'mcq', omrMode: pack.omrMode || 'mcq',
        maxAttempts: st.maxAttempts || 0, scoreMode: st.scoreMode || 'best',
        ownerUid: teacher.uid, variants, createdAt: pack.createdAt || new Date().toISOString(),
        published: true, submissionCount: 0
      });
    } catch (_) {}
  }));
  out.sort((x, y) => (x.createdAt || '').localeCompare(y.createdAt || ''));
  out.found = ids.size;
  return out;
};
// Локал дахь тестүүдийн ID-г серверийн индекс руу бичнэ (дараа нь ямар ч төхөөрөмжөөс сэргээх боломжтой болгоно)
const backfillExamIndex = (exams) => {
  try {
    const db = getDb(), t = ensureTeacherAuth();
    if (!db || !t || !(exams || []).length) return;
    const upd = {};
    exams.forEach(e => { if (e && e.id) upd['users/' + t.uid + '/exams/' + e.id] = true; });
    db.ref().update(upd).catch(() => {});
  } catch (_) {}
};

function App() {
  const [exams, setExams] = useLS('se_exams', []);
  const [submissions, setSubmissions] = useLS('se_submissions', []);
  const [restoring, setRestoring] = useState(false);
  const restoreExams = useCallback(async (silent) => {
    setRestoring(true);
    try {
      const list = await restoreExamsFromCloud();
      let added = 0;
      setExams(prev => {
        const have = new Set((prev || []).map(e => e.id));
        const add = list.filter(e => !have.has(e.id));
        added = add.length;
        return add.length ? [...(prev || []), ...add] : prev;
      });
      if (!silent) setTimeout(() => alert(list.length ? 'Сэргээсэн тест: ' + list.length : 'Серверээс таны тест олдсонгүй (ангид оноогоогүй, индекс үүсээгүй тест сэргээгдэхгүй).'), 50);
    } catch (e) {
      if (!silent) alert('Сэргээж чадсангүй: ' + (e?.message || e));
    }
    setRestoring(false);
  }, []);
  const restoreTriedRef = useRef(false);
  const [qrExam, setQrExam] = useState(null); // exam loaded from QR URL

  const [page, setPage] = useState({ type: 'landing' });
  const [roomLoaded, setRoomLoaded] = useState(null); // {roomID,title,subject,duration,passingScore,versions}
  const [assigningVariant, setAssigningVariant] = useState(false);
  const [meName, setMeName] = useState('');
  // Сервер (Firebase) нь үндсэн хадгалалт. Багшийн нүүр нээгдэх бүрт (сессэд нэг удаа) серверийн тестүүдийг локалтай нэгтгэнэ
  useEffect(() => {
    if (page.type !== 'teacherDash' || restoreTriedRef.current) return;
    restoreTriedRef.current = true;
    backfillExamIndex(exams);
    restoreExams(true).then(() => {});
  }, [page.type]);

  const assigningRef = useRef(false);
  const startStudentExam = useCallback(async (roomExam, studentName, studentClass) => {
    if (assigningRef.current) return;
    assigningRef.current = true;
    setAssigningVariant(true);
    try {
      const exam = await pickVariantForStudent(roomExam, studentName, studentClass);
      setPage({ type: 'examIntro', exam, studentName, studentClass });
    } catch (e) {
      alert('Хувилбар томилох алдаа: ' + (e?.message || 'дахин оролдоно уу'));
    } finally {
      assigningRef.current = false;
      setAssigningVariant(false);
    }
  }, []);

  // Hash + browser back (←) — Auth шаардлагатай
  useEffect(() => {
    const requireTeacher = () => {
      const u = ensureTeacherAuth();
      if (!u) {
        setPage({ type: 'teacherLogin' });
        return null;
      }
      return u.displayName || localStorage.getItem(SE_TEACHER) || u.email || 'Багш';
    };
    const applyHash = () => {
      const tag = (window.location.hash || '').replace(/^#/, '').split('&')[0];
      if (tag === 'teacher') {
        const name = requireTeacher();
        if (name) setPage({ type: 'teacherDash', name });
        return;
      }
      if (!tag) setPage(p => (p.type === 'teacherDash') ? { type: 'landing' } : p);
    };
    window.addEventListener('popstate', applyHash);
    const tag0 = (window.location.hash || '').replace(/^#/, '');
    if (tag0 === 'teacher') applyHash();
    return () => window.removeEventListener('popstate', applyHash);
  }, []);

  // Prefetch anonymous auth — QR/code join becomes much faster
  useEffect(() => { prefetchStudentAuth(); }, []);

  // Auth state — anonymous-гүй багш session сэргээнэ
  useEffect(() => {
    const auth = getAuth();
    if (!auth) return;
    let restored = false;
    const unsub = auth.onAuthStateChanged(user => {
      if (user && !user.isAnonymous) {
        const name = user.displayName || localStorage.getItem(SE_TEACHER) || user.email || 'Багш';
        try { localStorage.setItem(SE_TEACHER, name); } catch {}
        // Нэвтрэлт хадгалагдсан: хуудсыг дахин нээхэд шууд өөрийн хэсэг рүү оруулна (нэг л удаа)
        if (!restored) {
          restored = true;
          let role = '', qrBoot = null;
          try { role = localStorage.getItem('se_role') || ''; qrBoot = sessionStorage.getItem('se_qr_boot'); } catch {}
          const hasHash = !!(window.location.hash || '').replace(/^#/, '');
          if (!qrBoot && !hasHash) {
            setPage(p => {
              if (p.type !== 'landing') return p;
              if (role === 'teacher') {
                try { history.pushState({ se: 'teacher' }, '', appUrlWithHash('teacher')); } catch {}
                return { type: 'teacherDash', name };
              }
              if (role === 'student') { setMeName(user.displayName || 'Сурагч'); return { type: 'studentHome' }; }
              return p;
            });
          }
        }
      }
    });
    return () => unsub();
  }, []);

  // Handle QR URL hash on load (Safari may clear hash — also check sessionStorage)
  useEffect(() => {
    prefetchStudentAuth();
    let roomID = null;
    let classKey = '';
    const hash = window.location.hash;
    if (hash.startsWith('#qr=')) {
      try {
        const compressed = hash.slice(4);
        const json = LZString.decompressFromEncodedURIComponent(compressed);
        const packed = JSON.parse(json);
        const parsed = unpackExamFromQR(packed);
        roomID = parsed?.roomID || null;
        classKey = parsed?.classKey || '';
        try {
          sessionStorage.setItem('se_qr_boot', JSON.stringify({ roomID, classKey, t: Date.now() }));
        } catch {}
        history.replaceState(null, '', appUrlWithHash(''));
      } catch (e) { console.error('QR decode error', e); }
    }
    if (!roomID) {
      try {
        const boot = JSON.parse(sessionStorage.getItem('se_qr_boot') || 'null');
        if (boot?.roomID && (Date.now() - (boot.t || 0)) < 120000) {
          roomID = boot.roomID;
          classKey = boot.classKey || window.__SE_QR_PREFETCH__?.classKey || '';
        }
      } catch {}
    }
    if (window.__SE_QR_PREFETCH__?.roomID) {
      roomID = roomID || window.__SE_QR_PREFETCH__.roomID;
      classKey = classKey || window.__SE_QR_PREFETCH__.classKey || '';
    }
    if (roomID) {
      try { sessionStorage.removeItem('se_qr_boot'); } catch {}
      setPage({ type: 'qrRoom', roomID, qrClassKey: classKey || '' });
    }
  }, []);

  const goHome = () => {
    setQrExam(null);
    setPage({ type: 'landing' });
    history.replaceState({ se: 'landing' }, '', appUrlWithHash(''));
  };

  const goTeacherDash = useCallback((name) => {
    const n = (name || '').trim() || localStorage.getItem(SE_TEACHER) || 'Багш';
    try { localStorage.setItem(SE_TEACHER, n); } catch {}
    setPage({ type: 'teacherDash', name: n });
    history.pushState({ se: 'teacher' }, '', appUrlWithHash('teacher'));
  }, []);

  const deleteExam = useCallback((exam) => {
    if (!exam?.id) return;
    setExams(prev => prev.filter(e => e.id !== exam.id));
    setSubmissions(prev => prev.filter(s => s.examId !== exam.id));
    const db = getDb();
    if (db) {
      try { roomRef(db, exam.id).remove(); } catch {}
    }
  }, [setExams, setSubmissions]);

  // Result page: special full-page rendering
  if (page.type === 'result') {
    return <ResultPage submission={page.submission} exam={page.exam} onHome={page.account ? () => setPage({ type: 'studentHome' }) : goHome} />;
  }

  // Exam taking: full-page
  if (page.type === 'exam') {
    return (
      <div>
        <ExamTaker
          exam={page.exam}
          studentName={page.studentName}
          studentClass={page.studentClass}
          onSubmit={sub => {
            setSubmissions(s => [...s, sub]);
            if (page.account && sub.verified) saveAttempt(sub, page.exam, page.account);
            setPage({ type: 'result', submission: sub, exam: page.exam, account: page.account });
          }}
          onBack={() => setPage({ type: 'landing' })}
        />
      </div>
    );
  }

  // Exam intro
  if (page.type === 'examIntro') {
    return (
      <div>
        <Topbar userName={page.studentName} role="student" onHome={goHome} />
        <ExamIntro
          exam={page.exam}
          studentName={page.studentName}
          studentClass={page.studentClass}
          onStart={() => setPage({ ...page, type: 'exam' })}
          onBack={() => setPage(page.account ? { type: 'studentHome' } : { type: 'landing' })}
        />
      </div>
    );
  }

  return (
    <div className="app">
      {assigningVariant && (
        <div className="modal-overlay" style={{zIndex:9999}}>
          <div className="modal" style={{maxWidth:360,textAlign:'center'}}>
            <div className="modal-body" style={{padding:28}}>
              <div className="spinner" style={{margin:'0 auto 14px'}} />
              <div style={{fontFamily:'Outfit',fontWeight:700}}>Хувилбар томилж байна...</div>
              <div style={{fontSize:'0.85rem',color:'var(--text2)',marginTop:8}}>Ангид тэнцүү хуваарилна (A/B)</div>
            </div>
          </div>
        </div>
      )}
      {page.type === 'landing' && (
        <>
          <LandingPage onSelect={role => {
            if (role === 'teacher') setPage({ type: 'teacherLogin' });
            if (role === 'student') {
              const u = getAuth()?.currentUser;
              if (u && !u.isAnonymous && localStorage.getItem('se_role') === 'student') { setMeName(u.displayName || 'Сурагч'); setPage({ type: 'studentHome' }); }
              else setPage({ type: 'studentAuth' });
            }
          }} />
        </>
      )}

      {page.type === 'studentAuth' && <StudentAuth onBack={goHome} onDone={n => { setMeName(n); setPage({ type: 'studentHome' }); }} />}
      {page.type === 'studentHome' && (
        <div>
          <Topbar userName={meName || getAuth()?.currentUser?.displayName || 'Сурагч'} role="student" onHome={() => {}} />
          <StudentHome name={meName || getAuth()?.currentUser?.displayName || 'Сурагч'}
            onStart={(exam, account) => setPage({ type: 'examIntro', exam, studentName: meName || getAuth()?.currentUser?.displayName || 'Сурагч', studentClass: '', account })}
            onLogout={async () => { await teacherSignOut(); goHome(); }} />
        </div>
      )}
      {page.type === 'classes' && (
        <div><Topbar userName={page.name} role="teacher" onHome={goHome} />
          <ClassesPage exams={exams} onBack={() => setPage({ type: 'teacherDash', name: page.name })} /></div>
      )}

      {page.type === 'teacherLogin' && (
        <>
          <LandingPage onSelect={() => {}} />
          <TeacherLogin
            onLogin={(name) => {
              try { localStorage.setItem(SE_TEACHER, name); } catch {}
              setPage({ type: 'teacherDash', name });
              history.replaceState({ se: 'teacher' }, '', appUrlWithHash('teacher'));
            }}
          />
        </>
      )}

      {page.type === 'teacherDash' && (
        <div>
          <Topbar
            userName={page.name}
            role="teacher"
            onHome={goHome}
          />
          <div className="container-lg" style={{paddingTop:8}}>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8,flexWrap:'wrap',paddingTop:8}}>
              <button className="btn btn-outline btn-sm" disabled={restoring} onClick={() => restoreExams(false)}>{restoring ? '⏳ Сэргээж байна...' : '☁️ Тестээ сэргээх'}</button>
              <button className="btn btn-violet btn-sm" onClick={() => setPage({ type: 'classes', name: page.name })}>👥 Ангиуд & дүн</button>
            </div>
            <TeacherDashboard
              exams={exams}
              submissions={submissions}
              teacherName={page.name}
              onCreateExam={() => setPage({ ...page, type: 'createExam' })}
              onEditExam={(exam) => setPage({ ...page, type: 'editExam', exam })}
              onLogout={async () => {
                await teacherSignOut();
                setPage({ type: 'landing' });
                history.replaceState({ se: 'landing' }, '', appUrlWithHash(''));
              }}
              onDeleteExam={deleteExam}
            />
          </div>
        </div>
      )}

      {page.type === 'editExam' && page.exam && (
        <div>
          <Topbar userName={page.name} role="teacher" onHome={goHome} />
          <div className="container-sm" style={{paddingTop:8, paddingBottom:40}}>
            <CreateExam
              key={page.exam.id}
              initialExam={page.exam}
              hasResults={submissions.some(x => x.examId === page.exam.id)}
              onSave={exam => {
                setExams(e => e.map(x => x.id === exam.id ? exam : x));
                setPage({ type: 'teacherDash', name: page.name });
              }}
              onCancel={() => setPage({ type: 'teacherDash', name: page.name })}
            />
          </div>
        </div>
      )}

      {page.type === 'createExam' && (
        <div>
          <Topbar userName={page.name} role="teacher" onHome={goHome} />
          <div className="container-sm" style={{paddingTop:8, paddingBottom:40}}>
            <CreateExam
              onSave={exam => {
                setExams(e => [...e, exam]);
                setPage({ type: 'teacherDash', name: page.name });
              }}
              onCancel={() => setPage({ type: 'teacherDash', name: page.name })}
            />
          </div>
        </div>
      )}

      {page.type === 'qrRoom' && page.roomID && (
        <QRRoomLoader
          roomID={page.roomID}
          onLoaded={(roomExam) => {
            const ck = page.qrClassKey || '';
            const guessed = ck ? displayClassName(ck, ck) : '';
            // Show name screen immediately — refine class label in background
            setPage({
              type: 'qrStudent',
              exam: { ...roomExam, roomID: roomExam.roomID || page.roomID, qrClassKey: ck, qrClassName: guessed }
            });
            const db = getDb();
            if (ck && db) {
              roomRef(db, page.roomID).child('classes').child(ck).once('value')
                .then(snap => {
                  const name = snap.val()?.name;
                  if (!name) return;
                  setPage(p => (p.type === 'qrStudent' ? {
                    ...p,
                    exam: { ...p.exam, qrClassName: name }
                  } : p));
                })
                .catch(() => {});
            }
          }}
          onBack={goHome}
        />
      )}

      {page.type === 'qrStudent' && page.exam && (
        <QRStudentLogin
          exam={page.exam}
          qrClassName={page.exam.qrClassName}
          onStart={(name, cls) => startStudentExam(page.exam, name, cls)}
          onBack={goHome}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
