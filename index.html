// ─── TEACHER LOGIN (Firebase Auth) ───────────────────────────────────────────
function TeacherLogin({ onLogin }) {
  const [mode, setMode] = useState('login'); // login | register
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');

  const handle = async () => {
    setErr('');
    if (!email.trim() || !password) { setErr('Имэйл болон нууц үг оруулна уу'); return; }
    if (password.length < 6) { setErr('Нууц үг дор хаяж 6 тэмдэгт'); return; }
    if (mode === 'register' && !name.trim()) { setErr('Нэрээ оруулна уу'); return; }
    setBusy(true);
    try {
      let user;
      if (mode === 'register') {
        user = await teacherSignUp(email, password, name.trim());
      } else {
        user = await teacherSignIn(email, password);
      }
      const display = sanitizeText(user.displayName || name.trim() || email.split('@')[0], 80);
      try {
        localStorage.setItem(SE_TEACHER, display);
        if (window.SESecurity) SESecurity.saveTeacherMeta({ uid: user.uid, email: user.email, displayName: display });
      } catch {}
      onLogin(display, user);
    } catch (e) {
      const code = e?.code || '';
      if (code === 'auth/email-already-in-use') setErr('Энэ имэйл бүртгэлтэй байна — нэвтэрнэ үү');
      else if (code === 'auth/invalid-email') setErr('Имэйл буруу байна');
      else if (code === 'auth/wrong-password' || code === 'auth/invalid-credential') setErr('Имэйл эсвэл нууц үг буруу');
      else if (code === 'auth/user-not-found') setErr('Бүртгэл олдсонгүй — эхлээд бүртгүүлнэ үү');
      else if (code === 'auth/weak-password') setErr('Нууц үг хэт сул байна');
      else if (code === 'auth/operation-not-allowed') setErr('Firebase Console-д Email/Password Auth идэвхжүүлнэ үү');
      else if (code === 'auth/configuration-not-found') setErr('Firebase Authentication идэвхгүй байна. Console → Authentication → Email/Password идэвхжүүлнэ үү');
      else setErr(e?.message || 'Нэвтрэхэд алдаа');
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="modal-overlay">
      <div className="modal">
        <div className="modal-head">
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:'1.4rem'}}>🔐</span>
            <div>
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>Багшийн аюулгүй нэвтрэлт</div>
              <div style={{fontSize:'0.8rem',color:'var(--text2)'}}>Firebase Auth · email / нууц үг</div>
            </div>
          </div>
        </div>
        <div className="modal-body">
          <div style={{display:'flex',gap:8,marginBottom:14}}>
            <button type="button" className={'btn btn-sm' + (mode === 'login' ? ' btn-primary' : ' btn-outline')} onClick={() => setMode('login')}>Нэвтрэх</button>
            <button type="button" className={'btn btn-sm' + (mode === 'register' ? ' btn-primary' : ' btn-outline')} onClick={() => setMode('register')}>Бүртгүүлэх</button>
          </div>
          {mode === 'register' && (
            <div className="form-group">
              <label className="form-label">Багшийн нэр</label>
              <input className="form-input" placeholder="Таны нэр" value={name} onChange={e => setName(e.target.value)} autoFocus />
            </div>
          )}
          <div className="form-group">
            <label className="form-label">Имэйл</label>
            <input className="form-input" type="email" autoComplete="username" placeholder="bagsh@school.mn"
              value={email} onChange={e => setEmail(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && !busy && handle()} />
          </div>
          <div className="form-group">
            <label className="form-label">Нууц үг</label>
            <div style={{display:'flex',gap:8}}>
              <input className="form-input" type={showPass ? 'text' : 'password'} autoComplete={mode === 'login' ? 'current-password' : 'new-password'}
                placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && !busy && handle()} style={{flex:1}} />
              <button type="button" className="btn btn-outline btn-sm" onClick={() => setShowPass(s => !s)}>{showPass ? '🙈' : '👁'}</button>
            </div>
          </div>
          {err && <div className="form-error">⚠ {err}</div>}
        </div>
        <div className="modal-foot">
          <button className="btn btn-primary btn-lg" onClick={handle} disabled={busy}>
            {busy ? '⏳ ...' : (mode === 'register' ? '✅ Бүртгүүлэх' : '▶ Нэвтрэх')}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─── QUESTION EDITOR ──────────────────────────────────────────────────────────
// Файлаас зураг уншиж, жижигрүүлээд (≤900px JPEG) data URL болгоно
const LETTER_KEY = (ch) => {
  const u = String(ch || '').trim().charAt(0);
  const map = { А: 'A', Б: 'B', В: 'C', Г: 'D', а: 'A', б: 'B', в: 'C', г: 'D' };
  if (map[u]) return map[u];
  const U = u.toUpperCase();
  return 'ABCD'.includes(U) ? U : null;
};

const rebuildPdfPageText = (items, pageWidth) => {
  const mid = (pageWidth || 0) / 2;
  const xs = (items || []).map((it) => it.transform[4]);
  const hasCols = pageWidth && xs.filter((x) => x > mid + 18).length > items.length * 0.22
    && xs.filter((x) => x < mid - 18).length > items.length * 0.22;
  const group = (list) => {
    const rows = [];
    (list || []).forEach((it) => {
      const str = it.str == null ? '' : String(it.str);
      if (!str) return;
      const x = it.transform[4];
      const y = it.transform[5];
      const h = Math.abs(it.height || it.transform[3] || 10);
      const tol = Math.max(2.4, h * 0.42);
      let row = rows.find((r) => Math.abs(r.y - y) < tol);
      if (!row) { row = { y, parts: [] }; rows.push(row); }
      row.parts.push({ x, w: it.width || 0, str });
    });
    rows.sort((a, b) => b.y - a.y);
    return rows.map((r) => {
      r.parts.sort((a, b) => a.x - b.x);
      let s = '';
      let prev = null;
      r.parts.forEach((p) => {
        if (prev && p.x > prev.x + (prev.w || 0) + 1.1 && !/\s$/.test(s) && !/^\s/.test(p.str)) s += ' ';
        s += p.str;
        prev = p;
      });
      return s.replace(/[ \t]+/g, ' ').trim();
    }).filter(Boolean);
  };
  if (!hasCols) return group(items).join('\n');
  const left = items.filter((it) => it.transform[4] < mid);
  const right = items.filter((it) => it.transform[4] >= mid);
  const rightRows = group(right);
  const avgRight = rightRows.length ? rightRows.reduce((t, r) => t + r.length, 0) / rightRows.length : 0;
  // Баруун талд "B. 20" шиг богино сонголтууд л байвал энэ нь 2 багана биш — мөрийг нь хэвээр нь авна
  if (avgRight < 22) return group(items).join('\n');
  return group(left).join('\n') + '\n' + rightRows.join('\n');
};

const extractPdfText = async (file, onPage) => {
  if (!window.pdfjsLib) throw new Error('PDF сан ачаалагдаагүй. Хуудсыг дахин ачаална уу.');
  if (file.size > 40e6) throw new Error('Файл 40 MB-аас бага байх ёстой.');
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    if (onPage) onPage(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const vp = page.getViewport({ scale: 1 });
    const items = (tc.items || []).filter((it) => !(/^\d{1,3}$/.test(String(it.str || '').trim()) && it.transform[5] < vp.height * 0.05));
    pages.push(rebuildPdfPageText(items, vp.width));
  }
  const txt = pages.join('\n\n').replace(/\u00a0/g, ' ').replace(/[ \t]+\n/g, '\n').trim();
  if (txt.replace(/\s/g, '').length < 12) {
    throw new Error('Энэ PDF-ээс текст олдсонгүй (скан/зураг байж магадгүй). Текстэн PDF эсвэл текстийг copy-paste хийнэ үү.');
  }
  return txt;
};


// ─── PDF-ийн зураг / диаграммыг асуулт бүрт автоматаар таслан хавсаргах ────────
// Арга: хуудсыг canvas дээр зурна → текстийн хайрцгуудыг цайруулна → үлдсэн "бэх" = зураг/диаграмм/хүснэгт.
// Асуултын дугаар ("1.", "2." ...) нь хуудасны зүүн захад байх тул түүгээр асуултын мужийг тогтооно.
const PDF_FIG_SCALE = 2;
const extractPdfFigures = async (file, onPage) => {
  if (!window.pdfjsLib) return {};
  if (file.size > 40e6) return {};
  const S = PDF_FIG_SCALE;
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const parts = {};            // n -> [canvas, ...]
  let last = 0;
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };

  for (let p = 1; p <= pdf.numPages; p++) {
    if (onPage) onPage(p, pdf.numPages);
    const page = await pdf.getPage(p);
    const vp = page.getViewport({ scale: S });
    const W = Math.ceil(vp.width), H = Math.ceil(vp.height);
    const tc = await page.getTextContent();
    const boxes = (tc.items || []).filter((it) => it.str != null && String(it.str).trim()).map((it) => {
      const t = it.transform;
      const fs = Math.abs(it.height) || Math.hypot(t[2], t[3]) || 10;
      const pt = vp.convertToViewportPoint(t[4], t[5]);
      const w = (it.width || 0) * S;
      return { str: String(it.str).trim(), x0: pt[0] - 2, x1: pt[0] + w + 2, y0: pt[1] - fs * S - 2, y1: pt[1] + fs * S * 0.35 + 2 };
    });
    if (!boxes.length) { page.cleanup(); continue; }

    // "Хоёрдугаар хэсэг" эхэлбэл сонгох даалгавар дууссан гэж үзнэ
    if (last > 0 && boxes.some((b) => /хоёрдугаар\s+хэсэг|бүтээх\s+даалгавар/i.test(b.str))) { page.cleanup(); break; }

    const topY = H * 0.07, botY = H * 0.905;
    const minX = Math.min(...boxes.map((b) => b.x0));
    const anchors = [];
    boxes.forEach((b) => {
      const m = b.str.match(/^(\d{1,3})\.(?:\s|$)/);
      if (m && b.x0 <= minX + 30 * S && b.y0 < botY) anchors.push({ n: +m[1], y: b.y0 });
    });
    anchors.sort((a, b) => a.y - b.y);
    const prevLast = last;
    const valid = [];
    anchors.forEach((a) => {
      if (a.n === last + 1 || (last > 0 && a.n === last + 2)) { valid.push(a); last = a.n; }
    });

    const segs = [];
    if (prevLast > 0 && (!valid.length || valid[0].n === prevLast + 1 || valid[0].n === prevLast + 2) && !anchors.some((a) => a.n === 1 && prevLast >= 8 && !valid.some((v) => v.n === 1))) {
      segs.push({ n: prevLast, y0: topY, y1: valid.length ? valid[0].y - 2 : botY });
    }
    valid.forEach((a, i) => segs.push({ n: a.n, y0: a.y - 4, y1: i + 1 < valid.length ? valid[i + 1].y - 2 : botY }));
    if (!segs.length) { page.cleanup(); continue; }

    const canvas = mk(W, H);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;

    // Текстийг цайруулсан хуулбар
    const mask = mk(W, H);
    const mctx = mask.getContext('2d', { willReadFrequently: true });
    mctx.drawImage(canvas, 0, 0);
    mctx.fillStyle = '#fff';
    boxes.forEach((b) => mctx.fillRect(b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0));
    const data = mctx.getImageData(0, 0, W, H).data;

    segs.forEach((sg) => {
      const y0 = Math.max(0, Math.floor(sg.y0)), y1 = Math.min(H, Math.floor(sg.y1));
      if (y1 - y0 < 20) return;
      const rows = new Array(y1 - y0).fill(0), cols = new Array(W).fill(0);
      let total = 0;
      for (let y = y0; y < y1; y++) {
        for (let x = 0; x < W; x++) {
          if (data[(y * W + x) * 4] < 215) { rows[y - y0]++; cols[x]++; total++; }
        }
      }
      if (total < 250) return;
      let ry0 = rows.findIndex((v) => v >= 3), ry1 = rows.length - 1 - [...rows].reverse().findIndex((v) => v >= 3);
      let rx0 = cols.findIndex((v) => v >= 3), rx1 = cols.length - 1 - [...cols].reverse().findIndex((v) => v >= 3);
      if (ry0 < 0 || rx0 < 0) return;
      let bb = { x0: rx0, x1: rx1, y0: y0 + ry0, y1: y0 + ry1 };
      if (bb.x1 - bb.x0 < 40 || bb.y1 - bb.y0 < 24) return;
      // Сонголтын үсэг (A. B. C. ...) зураг дотор байрласан, хажууд нь бичвэргүй бол хамт авна
      boxes.forEach((b) => {
        if (!/^(?:[A-EА-Е][.)]?\s*)+$/.test(b.str) || b.y0 < y0 || b.y1 > y1) return;
        const hasText = boxes.some((o) => o !== b && o.x0 >= b.x1 - 2 && o.x0 - b.x1 < 14 * S && o.y1 > b.y0 && o.y0 < b.y1 && (o.y1 - o.y0) >= 0.85 * (b.y1 - b.y0) && (/[А-Яа-яӨөҮү]{2}/.test(o.str) || /^[\d.,\s]+$/.test(o.str)));
        if (hasText) return;
        bb = { x0: Math.min(bb.x0, b.x0), x1: Math.max(bb.x1, b.x1), y0: Math.min(bb.y0, b.y0), y1: Math.max(bb.y1, b.y1) };
      });
      // Зурагт хамаарах богино шошго/тэнхлэгийн бичвэрийг (ойролцоо байгааг) хамт авна
      const gap = 10 * S;
      for (let it = 0; it < 1; it++) {
        let grew = false;
        boxes.forEach((b) => {
          if (b.x1 - b.x0 > W * 0.3 || b.str.length > 40) return;
          if (b.y1 < y0 || b.y0 > y1) return;
          if (/^\d{1,3}\.$/.test(b.str) && b.x0 <= minX + 12 * S) return;
          if ((b.y0 + b.y1) / 2 < bb.y0 - 4) return;
          const near = b.x1 >= bb.x0 - gap && b.x0 <= bb.x1 + gap && b.y1 >= bb.y0 - gap && b.y0 <= bb.y1 + gap;
          if (near && (b.x0 < bb.x0 || b.x1 > bb.x1 || b.y0 < bb.y0 || b.y1 > bb.y1)) {
            bb = { x0: Math.min(bb.x0, b.x0), x1: Math.max(bb.x1, b.x1), y0: Math.max(y0, Math.min(bb.y0, b.y0)), y1: Math.min(y1, Math.max(bb.y1, b.y1)) };
            grew = true;
          }
        });
        if (!grew) break;
      }
      const pad = 8;
      let cx0 = Math.max(0, Math.floor(bb.x0 - pad)), cx1 = Math.min(W, Math.ceil(bb.x1 + pad));
      let cy0 = Math.max(y0, Math.floor(bb.y0 - pad)), cy1 = Math.min(y1, Math.ceil(bb.y1 + pad));
      // Зурагтай хамт хавсрах ёсгүй (асуултын/сонголтын) мөрийг хайчилж таслахгүйн тулд захыг нь ухраана
      boxes.forEach((b) => {
        const cxm = (b.x0 + b.x1) / 2, cym = (b.y0 + b.y1) / 2;
        const insideBB = cxm >= bb.x0 && cxm <= bb.x1 && cym >= bb.y0 && cym <= bb.y1;
        if (insideBB) return;
        const hOverlap = b.x1 > cx0 && b.x0 < cx1, vOverlap = b.y1 > cy0 && b.y0 < cy1;
        if (hOverlap && vOverlap) {
          if (cym < bb.y0) cy0 = Math.max(cy0, Math.ceil(b.y1) + 1);
          else if (cym > bb.y1) cy1 = Math.min(cy1, Math.floor(b.y0) - 1);
          else if (cxm < bb.x0) cx0 = Math.max(cx0, Math.ceil(b.x1) + 1);
          else if (cxm > bb.x1) cx1 = Math.min(cx1, Math.floor(b.x0) - 1);
        }
      });
      if (cx1 - cx0 < 30 || cy1 - cy0 < 20) return;
      const crop = mk(cx1 - cx0, cy1 - cy0);
      crop.getContext('2d').drawImage(canvas, cx0, cy0, cx1 - cx0, cy1 - cy0, 0, 0, cx1 - cx0, cy1 - cy0);
      (parts[sg.n] = parts[sg.n] || []).push(crop);
    });
    page.cleanup();
  }

  const out = {};
  Object.keys(parts).forEach((k) => {
    const list = parts[k];
    const w = Math.max(...list.map((c) => c.width));
    const h = list.reduce((t, c) => t + c.height + 6, -6);
    const full = mk(w, h);
    const fctx = full.getContext('2d');
    fctx.fillStyle = '#fff'; fctx.fillRect(0, 0, w, h);
    let yy = 0;
    list.forEach((c) => { fctx.drawImage(c, 0, yy); yy += c.height + 6; });
    const maxW = 820;
    const sc = Math.min(1, maxW / w);
    const fin = mk(w * sc, h * sc);
    const g = fin.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, fin.width, fin.height);
    g.drawImage(full, 0, 0, fin.width, fin.height);
    let q = 0.82, url = fin.toDataURL('image/jpeg', q);
    while (url.length > 380000 && q > 0.4) { q -= 0.1; url = fin.toDataURL('image/jpeg', q); }
    if (url.length <= 390000) out[k] = url;
  });
  return out;
};

const extractInlineOptions = (line) => {
  const re = /(?:^|\s)([A-DА-Гa-dа-г])[.)]\s+/g;
  const matches = [...String(line).matchAll(re)];
  if (matches.length < 2) return null;
  const parts = [];
  matches.forEach((m, i) => {
    const key = LETTER_KEY(m[1]);
    const start = m.index + m[0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : line.length;
    if (key) parts.push({ key, text: String(line).slice(start, end).trim() });
  });
  return parts.length >= 2 ? parts : null;
};

// ─── Холбох дасгал: PDF-ээс таних туслахууд ─────────────────────────────────
const MATCH_TRIGGER_RE = /холбо[нж]|холбох|тохируул|харгалзуул|нийцүүл|хослуул|тааруул|match/i;
const matchKey = (ch) => {
  const u = String(ch || '').trim().charAt(0).toUpperCase();
  if (!u) return null;
  const i = 'АБВГДЕЖЗ'.indexOf(u);
  if (i >= 0) return 'ABCDEFGH'[i];
  return 'ABCDEFGH'.includes(u) ? u : null;
};
const MATCH_PAIR_ROW_RE = /^\s*(\d{1,2})\s*[.)．]\s*(.+?)\s+([А-ЗA-Hа-зa-h])\s*[.)．]\s+(.+)$/;
const MATCH_LEFT_RE = /^\s*(\d{1,2})\s*[.)．:]\s*(.+)$/;
const MATCH_RIGHT_RE = /^\s*([А-ЗA-Hа-зa-h])\s*[.)．]\s*(.+)$/;
const parseMatchAnswerToken = (token, n) => {
  const t = String(token || '');
  if (!n) return null;
  const arr = Array(n).fill('');
  const L = '[A-HА-Зa-hа-з]';
  let found = 0;
  for (const m of t.matchAll(new RegExp('(\\d{1,2})\\s*[-–—=:)]*\\s*(' + L + ')(?![A-Za-zА-Яа-яӨөҮү])', 'g'))) {
    const i = +m[1] - 1, k = matchKey(m[2]);
    if (i >= 0 && i < n && k) { arr[i] = k; found++; }
  }
  if (!found) {
    for (const m of t.matchAll(new RegExp('(' + L + ')\\s*[-–—=:)]\\s*(\\d{1,2})', 'g'))) {
      const i = +m[2] - 1, k = matchKey(m[1]);
      if (i >= 0 && i < n && k) { arr[i] = k; found++; }
    }
  }
  if (!found) {
    const letters = [...t.matchAll(new RegExp(L, 'g'))].map((m) => matchKey(m[0])).filter(Boolean);
    if (letters.length === n) letters.forEach((k, i) => { arr[i] = k; found++; });
  }
  return found ? arr.join(',') : null;
};
const checkMatchStart = (cur) => {
  if (cur && !cur._matching && !cur._matchOff && cur.type === 'mcq' && !cur.options.length && MATCH_TRIGGER_RE.test(cur.text || '')) {
    cur.type = 'match'; cur.left = []; cur.right = []; cur._matching = true; cur._side = '';
  }
};
// Холбох горимд мөр уншина. true буцаавал мөр хэрэглэгдсэн.
const consumeMatchLine = (cur, line) => {
  let m;
  const pushRight = (letter, text) => {
    const key = matchKey(letter);
    if (!key || cur.right.some((o) => o.key === key)) return false;
    cur.right.push({ key, text: (text || '').trim() }); cur._side = 'r'; return true;
  };
  if ((m = line.match(MATCH_PAIR_ROW_RE)) && +m[1] === cur.left.length + 1 && matchKey(m[3])) {
    if (pushRight(m[3], m[4])) { cur.left.push(m[2].trim()); return true; }
  }
  if ((m = line.match(MATCH_LEFT_RE))) {
    const n = +m[1];
    const isNextQ = n === cur.n + 1;
    const isNextLeft = n === cur.left.length + 1;
    let asLeft = false;
    if (isNextLeft && !isNextQ) asLeft = true;
    else if (isNextLeft && isNextQ) asLeft = !(cur.right.length > 0 && cur.right.length >= cur.left.length && cur.left.length >= 2);
    if (asLeft) { cur.left.push(m[2].trim()); cur._side = 'l'; return true; }
    return false;
  }
  if ((m = line.match(MATCH_RIGHT_RE)) && matchKey(m[1])) {
    if (pushRight(m[1], m[2])) return true;
  }
  if (cur.left.length || cur.right.length) {
    if (cur._side === 'l') cur.left[cur.left.length - 1] = (cur.left[cur.left.length - 1] + ' ' + line).trim();
    else if (cur.right.length) cur.right[cur.right.length - 1].text = (cur.right[cur.right.length - 1].text + ' ' + line).trim();
    return true;
  }
  return false;
};
const finishMatchQuestion = (q) => {
  if (!q._matching) return;
  const right = (q.right || []).slice().sort((a, b) => a.key.localeCompare(b.key));
  if ((q.left || []).length >= 2 && right.length >= 2) {
    q.type = 'match'; q.options = right; q.numericAnswer = null;
  } else {
    q.type = 'mcq'; q.options = right; q.left = [];
  }
  delete q.right; delete q._matching; delete q._side; delete q._matchOff;
};

const applyAnswerToken = (q, token) => {
  if (!q || token == null) return;
  const t = String(token).trim();
  if (q.type === 'match') {
    const a = parseMatchAnswerToken(t, (q.left || []).length);
    if (a) q.answer = a;
    return;
  }
  const letter = LETTER_KEY(t);
  if (letter) { q.answer = letter; return; }
  const digits = t.replace(/[_\s]/g, '').replace(/[^\d.-]/g, '');
  if (/^-?\d+(\.\d+)?$/.test(digits) && !(q.options || []).some((o) => o.text)) {
    q.type = 'grid';
    q.numericAnswer = digits;
    q.answer = digits;
  }
};

// ─── PDF-ийн төгсгөл дэх "Зөв хариултын түлхүүр" хэсгийг таних ───────────────
const ANSWER_KEY_HEADING_RE = /^[\s:：.\-–—_*#=•]*(?:зөв\s+хариулт(?:ын\s+түлхүүр|ууд)?|хариултын\s+(?:түлхүүр|хуудас)|хариулт(?:ууд)?|түлхүүр|answer\s*key|answers?|key)[\s:：.\-–—_*#=•]*$/i;
const ANSWER_PAIR_RE = /(?:^|[^\wА-Яа-яӨөҮү.])(\d{1,3})\s*[.):\-–]?\s*([A-DА-Гa-dа-г])(?![\wА-Яа-яӨөҮү])/g;
const ANSWER_NUM_RE = /(?:^|[^\wА-Яа-яӨөҮү.])(\d{1,3})\s*[:=)]\s*(-?\d+(?:[.,]\d+)?)(?![\wА-Яа-яӨөҮү])/g;
const joinSplitAnswerLines = (text) => {
  const ls = String(text || '').replace(/\u00a0/g, ' ').split('\n').map((l) => l.trim());
  const out = [];
  for (let i = 0; i < ls.length; i++) {
    if (/^\d{1,3}\s*[.):]?$/.test(ls[i]) && i + 1 < ls.length && /^(?:[A-DА-Гa-dа-г]|-?\d+(?:[.,]\d+)?)$/.test(ls[i + 1])) {
      const isNum = /^-?\d/.test(ls[i + 1]);
      out.push(ls[i].replace(/[.):]$/, '') + (isNum ? ': ' : ' ') + ls[i + 1]);
      i++;
    } else out.push(ls[i]);
  }
  return out;
};
const collectAnswerPairs = (text) => {
  const map = {};
  joinSplitAnswerLines(text).forEach((line) => {
    const mk = line.match(/^\s*(\d{1,3})\s*[.):]?\s+((?:\d{1,2}\s*[-–—=]\s*[A-HА-Зa-hа-з][\s,;]*){2,})$/);
    if (mk) { const qn = +mk[1]; if (qn >= 1 && !(qn in map)) map[qn] = mk[2].trim(); return; }
    for (const m of line.matchAll(ANSWER_PAIR_RE)) {
      const n = +m[1]; const k = LETTER_KEY(m[2]);
      if (k && n >= 1 && !(n in map)) map[n] = k;
    }
    for (const m of line.matchAll(ANSWER_NUM_RE)) {
      const n = +m[1];
      if (n >= 1 && !(n in map)) map[n] = m[2].replace(',', '.');
    }
  });
  return map;
};
const extractAnswerKeyFromText = (rawText) => {
  const lines = String(rawText || '').replace(/\r/g, '').split('\n');
  let start = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    const l = lines[i].trim();
    if (l && l.length <= 60 && ANSWER_KEY_HEADING_RE.test(l)) { start = i; break; }
  }
  let before, section;
  if (start >= 0) {
    before = lines.slice(0, start);
    section = lines.slice(start + 1);
  } else {
    // Гарчиггүй бол: төгсгөлд байгаа "1 A 6 B 11 C" хэлбэрийн мөрүүдийг хайна
    let j = lines.length;
    while (j > 0) {
      const l = lines[j - 1].trim();
      if (!l) { j--; continue; }
      if (/^(?:№\s*хариу\s*)+$/i.test(l)) { j--; continue; }
      const left = l.replace(ANSWER_PAIR_RE, ' ').replace(/[\s.,;:|\-–]+/g, '');
      if (!left && /\d/.test(l)) { j--; continue; }
      break;
    }
    before = lines.slice(0, j);
    section = lines.slice(j);
  }
  const map = collectAnswerPairs(section.join('\n'));
  if (Object.keys(map).length < 3) return null;
  return { map, text: before.join('\n') };
};

// Хуудас бүр дээр давтагддаг толгой/хөлийг (жишээ: "Математикийн сорил · 2/3", давтагдсан гарчиг) хасна
const stripPageNoise = (rawText) => {
  const lines = String(rawText || '').replace(/\r/g, '').split('\n');
  const firstIdx = lines.findIndex((l) => l.trim());
  const first = firstIdx >= 0 ? lines[firstIdx].trim() : '';
  const canRepeat = first.length >= 8 && !/^\d/.test(first);
  return lines.filter((l, idx) => {
    const t = l.trim();
    if (!t) return true;
    if (t.includes('·') && (/\b\d+\s*\/\s*\d+\b/.test(t) || /(?:^|\s)(?:Эхлэл|Хариу)(?:\s|$)/i.test(t))) return false;
    if (canRepeat && idx > firstIdx && t.toUpperCase().startsWith(first.toUpperCase())) return false;
    return true;
  }).join('\n');
};

const parseQuestionsLocal = (rawText) => {
  rawText = stripPageNoise(rawText);
  const key = extractAnswerKeyFromText(rawText);
  const out = parseQuestionsLocalBase(key ? key.text : rawText);
  if (key) out.forEach((q) => { const a = key.map[q.n]; if (a != null) applyAnswerToken(q, a); });
  return out;
};

const parseQuestionsLocalBase = (rawText) => {
  const rawLines = String(rawText || '').replace(/\r/g, '').split('\n');
  const lines = [];
  for (let i = 0; i < rawLines.length; i++) {
    const a = String(rawLines[i] || '').replace(/[ \t]+/g, ' ').trim();
    const b = String(rawLines[i + 1] || '').replace(/[ \t]+/g, ' ').trim();
    if (/^(?:№\s*)?\d{1,3}\.?$/.test(a) && b && !/^(?:№\s*)?\d{1,3}(?:[.)．。:]|\s)/.test(b)) {
      lines.push(a.replace(/\.$/, '') + '. ' + b);
      i++;
      continue;
    }
    lines.push(rawLines[i]);
  }
  const out = [];
  let cur = null;
  const startQ = (n, rest) => {
    if (cur) finishMatchQuestion(cur);
    cur = { n, id: n, text: (rest || '').trim(), options: [], answer: null, type: 'mcq', numericAnswer: null };
    out.push(cur);
    checkMatchStart(cur);
    const inline = extractInlineOptions(cur.text);
    if (inline) {
      const first = cur.text.search(/(?:^|\s)([A-DА-Гa-dа-г])[.)]\s+/);
      if (first > 0) cur.text = cur.text.slice(0, first).trim();
      inline.forEach((o) => {
        if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o);
      });
    }
  };
  lines.forEach((raw) => {
    const line = String(raw || '').replace(/[ \t]+/g, ' ').trim();
    if (!line) return;
    if (/^[IVX]{1,4}\s*\.?\s*(?:хэсэг|бүлэг|part|section)(?![\wА-Яа-я])/i.test(line)) return;
    let m;
    if (/^(нэр|огноо|анги|хичээл|хугацаа|код|тест|шалгалт)\s*[:：]/i.test(line) && !cur) return;
    if (cur && (m = line.match(/^\s*(?:зөв\s*)?(?:хариу(?:лт)?|answer|ans|correct)\s*[:：]\s*(.+)/i))) {
      if (cur._matching) { const a = parseMatchAnswerToken(m[1], cur.left.length); if (a) { cur.answer = a; return; } }
      applyAnswerToken(cur, m[1]);
      return;
    }
    if (cur && cur._matching && consumeMatchLine(cur, line)) return;
    if (m = line.match(/^\s*(?:(?:асуулт|question|даалгавар|тест)\s+)?(?:№\s*)?(\d{1,3})\s*(?:[.)．。:]|\s+[-–—]\s+)\s*(.*)$/i)) {
      const n = +m[1];
      const rest = m[2] || '';
      const lastN = cur ? cur.n : 0;
      const looksOptNum = cur && n >= 1 && n <= 4 && n === cur.options.length + 1 && n !== lastN + 1 && lastN > 0;
      if (looksOptNum) {
        cur.options.push({ key: 'ABCD'[n - 1], text: rest.trim() });
        return;
      }
      const isSeq = !cur || n === lastN + 1 || (n > lastN && n - lastN <= 2);
      const restart = !!(cur && n === 1 && lastN >= 8 && (cur.options.length >= 2 || (cur.text || '').length > 24));
      if (isSeq || restart) {
        startQ(n, rest);
        return;
      }
    }
    // "1 12 + 8 = ?" (цэггүй дугаар) эсвэл дан "1" мөр — зөвхөн дараалал таарвал асуулт гэж үзнэ
    if ((m = line.match(/^(\d{1,3})\s+(\S.*)$/)) && +m[1] === (cur ? cur.n : 0) + 1 && !/^[A-DА-Гa-dа-г][.)]/.test(m[2])) {
      startQ(+m[1], m[2]);
      return;
    }
    if ((m = line.match(/^(\d{1,3})$/)) && +m[1] === (cur ? cur.n : 0) + 1) {
      startQ(+m[1], '');
      return;
    }
    if (cur && (m = line.match(/^\s*(?:\(?\s*)([A-DА-Гa-dа-г])(?:\s*\)|\s*[.)．])\s*(.*)$/))) {
      const key = LETTER_KEY(m[1]);
      const rest = (m[2] || '').trim();
      const inline = extractInlineOptions(line);
      if (inline) {
        inline.forEach((o) => { if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o); });
        return;
      }
      if (key) {
        const existing = cur.options.find((o) => o.key === key);
        if (existing) existing.text = (existing.text + ' ' + rest).trim();
        else cur.options.push({ key, text: rest });
      }
      return;
    }
    if (cur) {
      const inline = extractInlineOptions(line);
      if (inline && cur.options.length < 2) {
        inline.forEach((o) => { if (!cur.options.some((x) => x.key === o.key)) cur.options.push(o); });
        return;
      }
      if (/[*✓✔]|(\(correct\)|\(зөв\))/i.test(line) && cur.options.length) {
        const k = LETTER_KEY(line);
        if (k) cur.answer = k;
      }
      cur.text = (cur.text + ' ' + line).replace(/\s+/g, ' ').trim();
      checkMatchStart(cur);
    }
  });
  out.forEach(finishMatchQuestion);
  return out.filter((q) => (q.text && q.text.trim()) || (q.options || []).some((o) => (o.text || '').trim()));
};

const finalizeImportedQuestions = (list) => {
  const tfRe = /зөв|үнэн|буруу|худал|true|false/i;
  return (list || []).map((q, i) => {
    if (q.type === 'match' && (q.left || []).length >= 2) {
      const lefts = q.left.map((t) => String(t || '').trim());
      const ans = q.answer ? matchToArr(q.answer, lefts.length) : [];
      return {
        id: i + 1, text: (q.text || '').trim(), type: 'match', topic: q.topic || '',
        left: lefts,
        options: (q.options || []).map((o) => ({ key: o.key, text: (o.text || '').trim() })),
        answer: ans.some(Boolean) ? ans.join(',') : null,
        sourceText: q.sourceText || '', imageUrl: q.imageUrl || '', audioUrl: '', unit: '', numericAnswer: null
      };
    }
    const optsIn = q.options || [];
    const filled = optsIn.filter((o) => (o.text || '').trim()).length;
    let type = q.type || 'mcq';
    if (type !== 'grid' && filled === 2 && optsIn.every((o) => tfRe.test(o.text || ''))) type = 'tf';
    if (type !== 'tf' && filled === 0 && (q.numericAnswer || /^\d+(\.\d+)?$/.test(String(q.answer || '')))) type = 'grid';
    let options;
    if (type === 'tf') options = defaultOptionsForType('tf');
    else if (type === 'grid') options = [];
    else {
      options = ['A', 'B', 'C', 'D'].map((key, oi) => {
        const hit = optsIn.find((o) => o.key === key) || optsIn[oi];
        return { key, text: (hit && hit.text) || '' };
      });
    }
    let answer = q.answer ?? q.numericAnswer ?? null;
    if (answer != null && type !== 'grid') {
      const k = LETTER_KEY(answer);
      answer = k || String(answer).trim().slice(0, 8);
    }
    return {
      id: i + 1,
      text: (q.text || '').trim(),
      type,
      topic: q.topic || '',
      options,
      answer,
      sourceText: q.sourceText || '',
      imageUrl: q.imageUrl || '',
      audioUrl: q.audioUrl || '',
      unit: q.unit || '',
      numericAnswer: type === 'grid' ? (q.numericAnswer || q.answer || null) : null
    };
  });
};

// Асуулт задлах (AI түлхүүргүй, бүгд хөтчийн дотор ажиллана)
const parseTestWithAI = async (rawText, _apiKey, figures) => {
  const figs = figures || {};
  const local = parseQuestionsLocal(rawText);
  if (!local.length) throw new Error('Асуулт илрэхгүй байна. Дугаарласан асуулт (1. 2. 3.) байгаа эсэхийг шалгана уу.');
  local.forEach((q) => { const k = q.n || q.id; if (figs[k] && !q.imageUrl) q.imageUrl = figs[k]; });
  return finalizeImportedQuestions(local);
};

function PdfImportStep({ onParsed, onManual, onBack, variantCount, onVariantCountChange, currentVariantLabel }) {
  const [raw, setRaw] = useState('');
  const [parsing, setParsing] = useState(false);
  const [err, setErr] = useState('');
  const [status, setStatus] = useState('');
  const [figs, setFigs] = useState({});
  const vLabel = currentVariantLabel || 'A';

  const runParse = async (text, figMap) => {
    const src = (text || '').trim();
    if (!src) return;
    setParsing(true); setErr('');
    try {
      const qs = await parseTestWithAI(src, '', figMap || {});
      if (!Array.isArray(qs) || qs.length === 0) throw new Error('Асуулт илрэхгүй байна');
      setStatus(qs.length + ' асуулт · ' + qs.filter((q) => q.imageUrl).length + ' зурагтай бүгд орж ирлээ');
      onParsed(qs);
    } catch (e) {
      setErr('Алдаа: ' + (e?.message || 'Тодорхойгүй алдаа'));
    } finally {
      setParsing(false);
    }
  };

  const loadPdf = async (file) => {
    if (!file) return;
    setParsing(true); setErr(''); setStatus('PDF уншиж байна...');
    try {
      const txt = await extractPdfText(file, (p, n) => setStatus('Хуудас ' + p + ' / ' + n + ' задалж байна...'));
      setRaw(txt);
      let fm = {};
      try {
        fm = await extractPdfFigures(file, (p, n) => setStatus('Зураг, диаграмм таслаж байна... ' + p + ' / ' + n));
      } catch (_) { fm = {}; }
      setFigs(fm);
      setStatus('Текст бэлэн · ' + Object.keys(fm).length + ' зураг олдлоо · асуултуудыг задлаж байна...');
      await runParse(txt, fm);
    } catch (e) {
      setParsing(false);
      setErr('Алдаа: ' + (e?.message || 'PDF'));
    }
  };

  return (
    <div>
      <div className="version-indicator" style={{marginBottom:16, flexWrap:'wrap'}}>
        <div className="version-indicator-icon">{vLabel}</div>
        <div className="version-indicator-text" style={{flex:'1 1 160px', minWidth:0}}>
          <div className="version-indicator-label">Хувилбар {vLabel} — PDF / текст</div>
          <div className="version-indicator-sub">Бүх дугаарласан асуултыг алгасалгүй оруулна</div>
        </div>
        {(variantCount || 1) < 5 && (
          <button className="btn btn-outline btn-sm" onClick={() => onVariantCountChange && onVariantCountChange()} style={{flexShrink:0}}>
            ➕ Хувилбар ({variantCount || 1}/5)
          </button>
        )}
      </div>
      <div className="ai-hint-box">
        <div className="ai-icon">📄</div>
        <div className="ai-hint-text">
          <strong>PDF эсвэл текст импорт</strong> — Текстэн PDF-ээс бүх асуултыг уншиж, зураг/диаграмм/хүснэгтийг автоматаар таслан асуулт бүрт хавсаргана. Скан (зураг) PDF-д OCR байхгүй.
        </div>
      </div>
      {parsing ? (
        <div className="parsing-overlay">
          <div className="spinner"></div>
          <div style={{fontFamily:'Outfit',fontWeight:700}}>{status || 'Асуултуудыг задлаж байна...'}</div>
        </div>
      ) : (
        <>
          <div className="form-group">
            <label className="form-label">PDF файл</label>
            <input type="file" accept="application/pdf,.pdf" className="form-input"
              onChange={(e) => { const f = e.target.files && e.target.files[0]; loadPdf(f); e.target.value = ''; }} />
          </div>
          <div className="form-group">
            <label className="form-label">Эсвэл тестийн текст</label>
            <textarea className="form-textarea" style={{minHeight:200,fontFamily:'monospace',fontSize:'0.82rem'}}
              placeholder="Тестийн текстийг энд paste хийнэ үү..." value={raw} onChange={e => setRaw(e.target.value)} />
            {status && !err && <div className="form-hint" style={{marginTop:6,color:'var(--green)'}}>{status}</div>}
            {err && <div className="form-error">⚠ {err}</div>}
          </div>
          <div style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:10}}>
            <button className="btn btn-outline" onClick={onBack}>← Буцах</button>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-outline" onClick={onManual}>✏ Гараар</button>
              <button className="btn btn-violet" onClick={() => runParse(raw, figs)} disabled={!raw.trim()}>✨ Бүгдийг задлах</button>
            </div>
          </div>
        </>
      )}
    </div>
  );
}

const fileToCompressedDataUrl = (file, maxSide = 900, quality = 0.75) => new Promise((resolve, reject) => {
  if (!file || !/^image\//.test(file.type)) { reject(new Error('Зөвхөн зураг сонгоно уу')); return; }
  const reader = new FileReader();
  reader.onerror = () => reject(new Error('Файл уншиж чадсангүй'));
  reader.onload = () => {
    const img = new Image();
    img.onerror = () => reject(new Error('Зураг нээгдсэнгүй'));
    img.onload = () => {
      const k = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      const out = c.toDataURL('image/jpeg', quality);
      if (out.length > 390000) reject(new Error('Зураг хэт том байна, жижиг зураг сонгоно уу'));
      else resolve(out);
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});


// Холбох асуултыг багш засах
function MatchEditor({ q, onChange }) {
  const left = q.left || [], opts = q.options || [];
  const arr = matchToArr(q.answer, left.length);
  const setLeft = (i, t) => onChange({ left: left.map((x, j) => j === i ? t : x) });
  const addLeft = () => { if (left.length >= 8) return; onChange({ left: [...left, ''], answer: matchFromArr([...arr, '']) || null }); };
  const delLeft = (i) => { if (left.length <= 2) return; onChange({ left: left.filter((_, j) => j !== i), answer: matchFromArr(arr.filter((_, j) => j !== i)) || null }); };
  const setRight = (i, t) => onChange({ options: opts.map((o, j) => j === i ? { ...o, text: t } : o) });
  const addRight = () => { if (opts.length >= 8) return; onChange({ options: [...opts, { key: 'ABCDEFGH'[opts.length], text: '' }] }); };
  const delRight = () => {
    if (opts.length <= 2) return;
    const gone = opts[opts.length - 1].key;
    onChange({ options: opts.slice(0, -1), answer: matchFromArr(arr.map(a => a === gone ? '' : a)) || null });
  };
  const setAns = (i, key) => { const next = arr.slice(); next[i] = key; onChange({ answer: matchFromArr(next) || null }); };
  return (
    <div style={{marginBottom:10}}>
      <div className="form-hint" style={{marginBottom:8}}>Зүүн талын зүйл бүрт баруун талаас зөв хариуг сонгоно. Сурагч хоорондоо холбоно.</div>
      <div className="form-label">Зүүн тал (1, 2, 3 ...)</div>
      {left.map((t, i) => (
        <div key={i} style={{display:'flex',gap:7,alignItems:'center',marginBottom:6}}>
          <div className="option-key">{i + 1}</div>
          <input className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}} placeholder={(i + 1) + '-р зүйл...'} value={t} onChange={e => setLeft(i, e.target.value)} />
          {left.length > 2 && <button type="button" className="btn btn-ghost btn-sm" onClick={() => delLeft(i)}>✕</button>}
        </div>
      ))}
      {left.length < 8 && <button type="button" className="btn btn-outline btn-sm" onClick={addLeft}>+ Зүүн тал нэмэх</button>}

      <div className="form-label" style={{marginTop:12}}>Баруун тал (А, Б, В ...)</div>
      {opts.map((o, i) => (
        <div key={o.key} style={{display:'flex',gap:7,alignItems:'center',marginBottom:6}}>
          <div className="option-key">{matchLabel(o.key)}</div>
          <input className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}} placeholder={matchLabel(o.key) + ' хариулт...'} value={o.text} onChange={e => setRight(i, e.target.value)} />
        </div>
      ))}
      <div style={{display:'flex',gap:8}}>
        {opts.length < 8 && <button type="button" className="btn btn-outline btn-sm" onClick={addRight}>+ Баруун тал нэмэх</button>}
        {opts.length > 2 && <button type="button" className="btn btn-ghost btn-sm" onClick={delRight}>− Сүүлийнхийг хасах</button>}
      </div>

      <div className="form-label" style={{marginTop:12}}>Зөв холболт</div>
      {left.map((t, i) => (
        <div key={i} className="answer-select-row" style={{marginBottom:6,flexWrap:'wrap'}}>
          <span className="answer-label" style={{minWidth:70}}>{i + 1}{t ? ' · ' + (t.length > 18 ? t.slice(0, 18) + '…' : t) : ''}</span>
          {opts.map(o => (
            <button type="button" key={o.key} className={'ans-btn' + (arr[i] === o.key ? ' selected' : '')}
              onClick={() => setAns(i, arr[i] === o.key ? '' : o.key)}>{matchLabel(o.key)}</button>
          ))}
        </div>
      ))}
    </div>
  );
}

// Сурагч холбох асуултад хариулах
function MatchPlayer({ q, value, onChange }) {
  const left = q.left || [], opts = q.options || [];
  const n = left.length;
  const arr = matchToArr(value, n);
  const pick = (i, key) => {
    const next = arr.slice();
    if (next[i] === key) next[i] = '';
    else { for (let j = 0; j < n; j++) if (next[j] === key) next[j] = ''; next[i] = key; }
    onChange(matchFromArr(next));
  };
  return (
    <div>
      <div style={{background:'var(--surface2)',border:'1.5px solid var(--border)',borderRadius:12,padding:'10px 14px',marginBottom:12}}>
        {opts.map(o => (
          <div key={o.key} style={{display:'flex',gap:10,padding:'4px 0',fontSize:'0.9rem'}}>
            <b style={{minWidth:22,color:'var(--violet)'}}>{matchLabel(o.key)}.</b><span>{o.text}</span>
          </div>
        ))}
      </div>
      {left.map((t, i) => (
        <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:10,flexWrap:'wrap',padding:'8px 0',borderBottom:'1px dashed var(--border)'}}>
          <div style={{fontSize:'0.92rem',flex:'1 1 160px'}}><b>{i + 1}.</b> {t}</div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {opts.map(o => (
              <button type="button" key={o.key} className={'ans-btn' + (arr[i] === o.key ? ' selected' : '')}
                onClick={() => pick(i, o.key)}>{matchLabel(o.key)}</button>
            ))}
          </div>
        </div>
      ))}
      <div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:8}}>
        Таны холболт: {arr.map((a, i) => (i + 1) + '→' + (a ? matchLabel(a) : '—')).join('  ')}
      </div>
    </div>
  );
}

// Дүнгийн хуудсанд холбох асуултын хариуг харуулах
function MatchReview({ q, ua }) {
  const left = q.left || [], opts = q.options || [];
  const got = matchToArr(ua, left.length), want = matchToArr(q.answer, left.length);
  const txt = (k) => { const o = opts.find(x => x.key === k); return k ? matchLabel(k) + (o && o.text ? ' (' + o.text + ')' : '') : '—'; };
  return (
    <div>
      {left.map((t, i) => {
        const ok = want[i] && got[i] === want[i];
        return (
          <div key={i} style={{fontSize:'0.85rem',padding:'4px 0'}}>
            <b>{i + 1}.</b> {t} → <span style={{color: want[i] ? (ok ? 'var(--green)' : 'var(--red)') : 'inherit',fontWeight:700}}>{txt(got[i])}</span>
            {want[i] && !ok && <span style={{color:'var(--green)'}}> · зөв: {txt(want[i])}</span>}
          </div>
        );
      })}
    </div>
  );
}

function QuestionEditor({ questions, onChange, defaultType = 'mcq', subjectFeatures = [] }) {
  const setQ = (idx, field, val) => {
    const next = questions.map((q, i) => i === idx ? {...q, [field]: val} : q);
    onChange(next);
  };
  const setOpt = (qi, oi, val) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      const opts = (q.options || []).map((o, j) => j === oi ? {...o, text: val} : o);
      return {...q, options: opts};
    });
    onChange(next);
  };
  const changeType = (qi, type) => {
    const next = questions.map((q, i) => {
      if (i !== qi) return q;
      return {
        ...q,
        type,
        left: type === 'match' ? ['', '', '', ''] : [],
        options: defaultOptionsForType(type),
        answer: null,
        numericAnswer: type === 'grid' ? (q.numericAnswer || '') : null
      };
    });
    onChange(next);
  };
  const addQ = () => {
    onChange([...questions, {
      ...seedQuestion(defaultType),
      id: questions.length + 1
    }]);
  };
  const removeQ = idx => onChange(questions.filter((_, i) => i !== idx).map((q, i) => ({...q, id: i + 1})));

  return (
    <div>
      {questions.map((q, qi) => {
        const type = q.type || defaultType || 'mcq';
        return (
          <div className="question-item" key={qi} style={{marginBottom:16}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,gap:8,flexWrap:'wrap'}}>
              <span className="q-num">#{q.id}</span>
              <select className="form-select" style={{width:'auto',padding:'4px 10px',fontSize:'0.8rem'}}
                value={type} onChange={e => changeType(qi, e.target.value)}>
                <option value="mcq">A–D сонголт</option>
                <option value="tf">Зөв / Буруу</option>
                <option value="grid">Grid-in (тоон)</option>
                <option value="blank">Сул орон</option>
                <option value="match">Холбох (matching)</option>
              </select>
              <button className="btn btn-red btn-sm" onClick={() => removeQ(qi)}>✕ Устгах</button>
            </div>
            {(subjectFeatures.includes('source') || type === 'tf') && (
              <div className="form-group">
                <label className="form-label">Эх текст / Сурвалж</label>
                <textarea className="form-textarea" style={{minHeight:60,fontSize:'0.85rem'}}
                  placeholder="Эх текст..." value={q.sourceText || ''} onChange={e => setQ(qi, 'sourceText', e.target.value)} />
              </div>
            )}
            {subjectFeatures.includes('image') && (
              <div className="form-group">
                <label className="form-label">Зураг (сонголттой)</label>
                {q.imageUrl ? (
                  <div>
                    <img src={q.imageUrl} alt="Асуултын зураг"
                      style={{maxWidth:'100%',maxHeight:200,borderRadius:10,border:'1px solid var(--border)',display:'block',marginBottom:8,objectFit:'contain'}} />
                    <button type="button" className="btn btn-outline btn-sm"
                      onClick={() => setQ(qi, 'imageUrl', '')}>✕ Зураг устгах</button>
                  </div>
                ) : (
                  <input className="form-input" type="file" accept="image/*"
                    onChange={async e => {
                      const f = e.target.files && e.target.files[0];
                      e.target.value = '';
                      if (!f) return;
                      try { setQ(qi, 'imageUrl', await fileToCompressedDataUrl(f)); }
                      catch (err) { alert(err?.message || 'Зураг уншихад алдаа гарлаа'); }
                    }} />
                )}
              </div>
            )}
            <div className="form-row" style={{marginBottom:8}}>
              <div className="form-group" style={{marginBottom:0}}>
                <label className="form-label">Сэдэв (анализд)</label>
                <input className="form-input" placeholder="жн: Ионы холбоо" value={q.topic || ''}
                  onChange={e => setQ(qi, 'topic', e.target.value)} />
              </div>
              {subjectFeatures.includes('unit') && (
                <div className="form-group" style={{marginBottom:0}}>
                  <label className="form-label">Нэгж</label>
                  <input className="form-input" placeholder="жн: N, m/s²" value={q.unit || ''}
                    onChange={e => setQ(qi, 'unit', e.target.value)} />
                </div>
              )}
            </div>
            <textarea className="form-textarea" style={{minHeight:60,fontSize:'0.875rem',marginBottom:10}}
              placeholder="Асуултын текст..." value={q.text} onChange={e => setQ(qi, 'text', e.target.value)} />

            {type === 'match' ? (
              <MatchEditor q={q} onChange={(patch) => onChange(questions.map((qq, i) => i === qi ? {...qq, ...patch} : qq))} />
            ) : type === 'grid' ? (
              <div style={{marginBottom:10}}>
                <label className="form-label">Зөв хариу (3 оронтой тоо)</label>
                <input className="form-input" style={{maxWidth:160}} maxLength={3} placeholder="115"
                  value={q.numericAnswer || q.answer || ''}
                  onChange={e => {
                    const v = e.target.value.replace(/\D/g, '').slice(0, 3);
                    const next = questions.map((qq, i) => i === qi ? {...qq, numericAnswer: v, answer: v} : qq);
                    onChange(next);
                  }} />
                {q.unit && <span style={{marginLeft:8,color:'var(--text2)',fontWeight:600}}>{q.unit}</span>}
              </div>
            ) : (
              <>
                <div className="options-grid" style={{marginBottom:10}}>
                  {(q.options || []).map((opt, oi) => (
                    <div key={opt.key} style={{display:'flex',gap:7,alignItems:'center'}}>
                      <div className="option-key" style={{
                        background: q.answer===opt.key ? 'var(--green)' : undefined,
                        color: q.answer===opt.key ? 'white' : undefined,
                        border: q.answer===opt.key ? '1.5px solid var(--green)' : undefined
                      }}>{opt.key}</div>
                      <input className="form-input" style={{flex:1,padding:'6px 10px',fontSize:'0.82rem'}}
                        placeholder={opt.key + ' хариулт...'} value={opt.text}
                        onChange={e => setOpt(qi, oi, e.target.value)} />
                    </div>
                  ))}
                </div>
                <div className="answer-select-row">
                  <span className="answer-label">Зөв хариулт:</span>
                  {(q.options || []).map(opt => (
                    <button key={opt.key} className={'ans-btn' + (q.answer === opt.key ? ' selected' : '')}
                      onClick={() => setQ(qi, 'answer', q.answer === opt.key ? null : opt.key)}>{opt.key}</button>
                  ))}
                </div>
              </>
            )}
          </div>
        );
      })}
      <button className="btn btn-outline" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={addQ}>
        + Асуулт нэмэх
      </button>
    </div>
  );
}

// ─── CREATE EXAM (3-step wizard) ──────────────────────────────────────────────
function CreateExam({ onSave, onCancel, initialExam, hasResults }) {
  const editing = !!initialExam;
  const [step, setStep] = useState(1);
  const [info, setInfo] = useState(editing ? {
    title: initialExam.title || '', subject: initialExam.subject || GENERAL_PROFILE.name, subjectId: initialExam.subjectId || GENERAL_PROFILE.id,
    duration: initialExam.duration || 45, passingScore: initialExam.passingScore ?? 60,
    omrFormat: initialExam.omrFormat || 'mcq', omrMode: initialExam.omrMode || 'mcq',
    maxAttempts: initialExam.maxAttempts || 0, scoreMode: initialExam.scoreMode || 'best'
  } : {
    title: '', subject: GENERAL_PROFILE.name, subjectId: GENERAL_PROFILE.id, duration: 45, passingScore: 60,
    omrFormat: 'mcq', omrMode: 'mcq', maxAttempts: 0, scoreMode: 'best'
  });
  const [variants, setVariants] = useState(editing ? normalizeVariants(initialExam).map(v => ({ ...v, questions: (v.questions || []).map(q => ({ ...q })) })) : [{ label: 'A', questions: [] }]);
  const [activeVar, setActiveVar] = useState(0);
  const [saving, setSaving] = useState(false);
  const [step2Mode, setStep2Mode] = useState(editing ? 'manual' : 'parse');
  const [showInlinePdf, setShowInlinePdf] = useState(false);
  const [inlineRaw, setInlineRaw] = useState('');
  const [inlineParsing, setInlineParsing] = useState(false);
  const [inlineErr, setInlineErr] = useState('');
  const variantCount = variants.length;
  const profile = getSubjectProfile(info.subjectId || info.subject);
  const stepLabels = ['Үндсэн мэдээлэл', 'Асуулт үүсгэх'];

  const selectSubject = (p) => {
    setInfo(prev => ({
      ...prev,
      subject: p.name,
      subjectId: p.id,
      omrFormat: p.formats[0]?.id || 'mcq',
      omrMode: p.omrMode || 'mcq'
    }));
  };

  const handleManual = () => {
    const type = info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq';
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: (v.questions || []).length ? v.questions : [seedQuestion(type)]}) : v));
    setStep2Mode('manual');
  };

  const handleParsed = (qs) => {
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setStep2Mode('manual');
  };

  const applyImportedQuestions = (qs) => {
    if (!Array.isArray(qs) || !qs.length) throw new Error('Асуулт илрэхгүй');
    setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v));
    setShowInlinePdf(false); setInlineRaw('');
  };

  const doInlineParse = async () => {
    if (!inlineRaw.trim()) return;
    setInlineParsing(true); setInlineErr('');
    try { applyImportedQuestions(await parseTestWithAI(inlineRaw, '')); }
    catch (e) { setInlineErr(e?.message || 'Алдаа'); }
    finally { setInlineParsing(false); }
  };

  const doInlinePdf = async (file) => {
    if (!file) return;
    setInlineParsing(true); setInlineErr('');
    try {
      const txt = await extractPdfText(file);
      setInlineRaw(txt);
      let fm = {};
      try { fm = await extractPdfFigures(file); } catch (_) { fm = {}; }
      applyImportedQuestions(await parseTestWithAI(txt, '', fm));
    } catch (e) { setInlineErr(e?.message || 'PDF'); }
    finally { setInlineParsing(false); }
  };

  const addVariant = () => {
    // Keep current variant (A) questions; append empty B/C/... and open same entry flow
    if (variants.length >= 5) return;
    const nextIdx = variants.length;
    setVariants(prev => {
      if (prev.length >= 5) return prev;
      return [...prev, { label: alpha(prev.length), questions: [] }];
    });
    setActiveVar(nextIdx);
    setStep2Mode('parse');
    setShowInlinePdf(false); setInlineRaw(''); setInlineErr('');
  };

  const goNextVariant = () => addVariant();

  const selectVariantTab = (idx) => {
    setActiveVar(idx);
    const hasQs = ((variants[idx] && variants[idx].questions) || []).some(q => (q.text || '').trim());
    setStep2Mode(hasQs ? 'manual' : 'parse');
    setShowInlinePdf(false); setInlineRaw(''); setInlineErr('');
  };

  const handlePublish = () => {
    const hasAny = variants.some(v => (v.questions || []).some(q => (q.text || '').trim()));
    if (!hasAny) { alert('Дор хаяж нэг асуулт оруулна уу'); return; }
    if (!info.title.trim()) { alert('Шалгалтын нэр оруулна уу'); return; }
    if (editing && hasResults) {
      if (!confirm('Энэ шалгалтыг өгсөн сурагч байна. Асуулт/хариулт өөрчилбөл өмнөх дүн дахин тооцогдохгүй. Хадгалах уу?')) return;
    }
    setSaving(true);
    setTimeout(async () => {
      try {
        const teacher = ensureTeacherAuth();
        if (!teacher) {
          alert('Нэвтэрсэн багш олдсонгүй. Дахин нэвтэрнэ үү.');
          setSaving(false);
          return;
        }
        const normalizedVariants = variants.map((v, vidx) => {
          const valid = (v.questions || []).filter(q => (q.text || '').trim());
          return { label: v.label || alpha(vidx), questions: valid.map((q, i) => ({...q, id: i + 1})) };
        }).filter(v => v.questions.length > 0);
        const examId = editing ? initialExam.id : uid();
        const exam = {
          ...(editing ? initialExam : {}),
          id: examId,
          title: sanitizeText(info.title, 200),
          subject: sanitizeText(info.subject, 100),
          subjectId: info.subjectId,
          duration: info.duration,
          passingScore: info.passingScore,
          omrFormat: info.omrFormat,
          omrMode: info.omrMode || profile?.omrMode || 'mcq',
          maxAttempts: Math.max(0, Math.min(20, +info.maxAttempts || 0)),
          scoreMode: ['best', 'avg', 'last'].includes(info.scoreMode) ? info.scoreMode : 'best',
          ownerUid: teacher.uid,
          variants: normalizedVariants.length ? normalizedVariants : [{ label: 'A', questions: [] }],
          createdAt: editing ? (initialExam.createdAt || new Date().toISOString()) : new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          published: true,
          submissionCount: editing ? (initialExam.submissionCount || 0) : 0
        };
        const db = getDb();
        if (db) {
          const versions = {};
          const answerKeys = {};
          exam.variants.forEach((v) => {
            versions[v.label] = packQuestions(v.questions);
            answerKeys[v.label] = packAnswerKeys(v.questions);
          });
          const roomData = {
            roomID: exam.id,
            title: exam.title,
            subject: exam.subject,
            subjectId: exam.subjectId,
            duration: exam.duration,
            passingScore: exam.passingScore,
            omrFormat: exam.omrFormat,
            omrMode: exam.omrMode,
            ownerUid: teacher.uid,
            publicReadable: true,
            createdAt: exam.createdAt,
            versions,
            answerKeys
          };
          if (editing) { delete roomData.createdAt; await roomRef(db, exam.id).update(roomData); }
          else await roomRef(db, exam.id).set(roomData);
          // clientPack-д оролдлогын тохиргоо орсон байх ёстой (сурагч зөвхөн үүнийг уншдаг). Дүрэм зөвшөөрөхгүй бол хуучин хэлбэрээр хадгална.
          {
            const pack = buildClientPack({ ...exam, ownerUid: teacher.uid }, versions);
            try { await roomRef(db, exam.id).child('clientPack').set(pack); }
            catch (e) { console.warn('clientPack w/ attempts failed, retry plain', e); const { maxAttempts: _a, scoreMode: _b, ...plain } = pack; await roomRef(db, exam.id).child('clientPack').set(plain); }
          }
          try { await roomRef(db, exam.id).child('settings').set({ maxAttempts: exam.maxAttempts, scoreMode: exam.scoreMode }); } catch (e) { console.warn('settings save failed', e); }
          try { await db.ref('users/' + teacher.uid + '/exams/' + exam.id).set(true); } catch (_) {}
        }
        onSave(exam);
      } catch (e) {
        alert('Нийтлэхэд алдаа: ' + (e?.message || e) + '\n\nFirebase Auth нэвтэрсэн эсэх болон database rules deploy хийсэн эсэхийг шалгана уу.');
        setSaving(false);
      }
    }, 100);
  };

  const currentVariant = variants[activeVar] || { label: alpha(activeVar), questions: [] };
  const currentQCount = (currentVariant.questions || []).filter(q => q.text).length;
  const totalQCount = variants.reduce((sum, v) => sum + (v.questions||[]).filter(q=>q.text).length, 0);

  return (
    <div>
      <div className="page-header">
        <h2 className="page-title">{editing ? '✏ Шалгалт засах' : '✏ Шалгалт үүсгэх'}</h2>
        <div className="page-sub">{editing ? 'Асуулт, хугацаа, оролдлогын тоо, дүн тооцох горимыг засаад хадгална' : '2 алхамт мастер · хичээлийн тусгай OMR формат'}</div>
      </div>

      <div className="steps mb-4">
        {stepLabels.map((lbl, i) => (
          <React.Fragment key={i}>
            <div className={'step' + (step === i+1 ? ' active' : step > i+1 ? ' done' : '')}>
              <div className="step-num">{step > i+1 ? '✓' : i+1}</div>
              <span>{lbl}</span>
            </div>
            {i < stepLabels.length - 1 && <div className="step-line" />}
          </React.Fragment>
        ))}
      </div>

      <div className="card">
        <div className="card-body">
          {step === 1 && (
            <div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Шалгалтын нэр</label>
                  <input className="form-input" placeholder="жн: Ионы холбоо — Улирлын шалгалт"
                    value={info.title} onChange={e => setInfo(p => ({...p, title: e.target.value}))} />
                </div>
                <div className="form-group">
                  <label className="form-label">Хугацаа (мин)</label>
                  <input className="form-input" type="number" min="5" max="180" value={info.duration}
                    onChange={e => setInfo(p => ({...p, duration: +e.target.value}))} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Тэнцэх босго (%)</label>
                <input className="form-input" type="number" min="0" max="100" style={{maxWidth:160}}
                  value={info.passingScore}
                  onChange={e => setInfo(p => ({...p, passingScore: +e.target.value}))} />
              </div>
              <div className="form-row">
                <div className="form-group">
                  <label className="form-label">Өгөх оролдлогын тоо</label>
                  <select className="form-select" value={info.maxAttempts}
                    onChange={e => setInfo(p => ({...p, maxAttempts: +e.target.value}))}>
                    <option value={0}>Хязгааргүй</option>
                    {[1,2,3,4,5,10].map(n => <option key={n} value={n}>{n} удаа</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Дүнг хэрхэн тооцох</label>
                  <select className="form-select" value={info.scoreMode}
                    onChange={e => setInfo(p => ({...p, scoreMode: e.target.value}))}>
                    <option value="best">Хамгийн өндөр дүнгээр</option>
                    <option value="avg">Дундажаар</option>
                    <option value="last">Сүүлийн дүнгээр</option>
                  </select>
                </div>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
                <button className="btn btn-outline" onClick={onCancel}>Болих</button>
                <button className="btn btn-primary" onClick={() => setStep(2)}
                  disabled={!info.title.trim()}>Дараах →</button>
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <div style={{display:'flex',gap:8,marginBottom:16,flexWrap:'wrap'}}>
                {[
                  ['parse', '✨ PDF / Текст'],
                  ['manual', '✏ Гараар / Хянах']
                ].map(([id, lbl]) => (
                  <button key={id} className={'btn btn-sm' + (step2Mode === id ? ' btn-violet' : ' btn-outline')}
                    onClick={() => setStep2Mode(id)}>{lbl}</button>
                ))}
              </div>

              {step2Mode === 'parse' && (
                <PdfImportStep
                  onParsed={handleParsed}
                  onManual={handleManual}
                  onBack={() => setStep(1)}
                  variantCount={variantCount}
                  onVariantCountChange={addVariant}
                  currentVariantLabel={currentVariant.label || alpha(activeVar)}
                />
              )}

              {step2Mode === 'manual' && (
                <div>
                  <div className="version-indicator">
                    <div className="version-indicator-icon">{currentVariant.label || alpha(activeVar)}</div>
                    <div className="version-indicator-text">
                      <div className="version-indicator-label">Хувилбар {currentVariant.label || alpha(activeVar)}</div>
                      <div className="version-indicator-sub">
                        {currentQCount} асуулт · Нийт {totalQCount} · {info.subject} · {info.omrFormat}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setShowInlinePdf(s => !s)}>📄 PDF</button>
                      {variantCount < 5 && (
                        <button className="btn btn-sm" style={{background:'var(--violet)',color:'white'}} onClick={goNextVariant}>
                          ➕ Хувилбар
                        </button>
                      )}
                    </div>
                  </div>

                  <div className="version-tab-strip">
                    {variants.map((v, idx) => (
                      <button key={idx} className={'version-tab' + (idx === activeVar ? ' active' : '')}
                        onClick={() => selectVariantTab(idx)}>
                        {v.label || alpha(idx)}
                        <span className="vtab-count">{(v.questions||[]).filter(q=>q.text).length}</span>
                      </button>
                    ))}
                    <div style={{marginLeft:'auto',display:'flex',gap:8}}>
                      <button className="btn btn-outline btn-sm" onClick={() => setStep(1)}>← Буцах</button>
                      <button className="btn btn-green btn-sm" onClick={handlePublish} disabled={saving}>
                        {saving ? '⏳ ...' : editing ? '💾 Хадгалах' : '🚀 Нийтлэх'}
                      </button>
                    </div>
                  </div>

                  {showInlinePdf && (
                    <div className="inline-ai-panel">
                      {inlineParsing ? (
                        <div style={{textAlign:'center',padding:24}}><div className="spinner" /></div>
                      ) : (
                        <>
                          <input type="file" accept="application/pdf,.pdf" className="form-input" style={{marginBottom:8}}
                            onChange={(e) => { const f = e.target.files && e.target.files[0]; doInlinePdf(f); e.target.value = ''; }} />
                          <textarea className="form-textarea" style={{minHeight:120,fontFamily:'monospace',fontSize:'0.82rem'}}
                            value={inlineRaw} onChange={e => setInlineRaw(e.target.value)}
                            placeholder="PDF эсвэл текстийг paste..." />
                          {inlineErr && <div className="form-error">{inlineErr}</div>}
                          <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:8}}>
                            <button className="btn btn-outline btn-sm" onClick={() => setShowInlinePdf(false)}>Болих</button>
                            <button className="btn btn-violet btn-sm" onClick={doInlineParse} disabled={!inlineRaw.trim()}>✨ Бүгдийг задлах</button>
                          </div>
                        </>
                      )}
                    </div>
                  )}

                  {!(currentVariant.questions || []).length && (
                    <div style={{marginBottom:12}}>
                      <button className="btn btn-outline" onClick={handleManual}>+ Хоосон асуулт нэмэх</button>
                    </div>
                  )}

                  <QuestionEditor
                    questions={currentVariant.questions || []}
                    defaultType={info.omrFormat === 'tf' ? 'tf' : info.omrFormat === 'grid' ? 'grid' : 'mcq'}
                    subjectFeatures={profile?.features || []}
                    onChange={(qs) => setVariants(prev => prev.map((v, idx) => idx === activeVar ? ({...v, questions: qs}) : v))}
                  />
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


// ─── QR MODAL ─────────────────────────────────────────────────────────────────
function QRModal({ exam, onClose }) {
  const [step, setStep] = useState('confirm'); // confirm | addClass | qr
  const [classInput, setClassInput] = useState('');
  const [activeClassKey, setActiveClassKey] = useState('');
  const [classList, setClassList] = useState([]); // [{key,name}]
  const [savingClass, setSavingClass] = useState(false);
  const qrRef = useRef(null);
  const [joins, setJoins] = useState([]);
  const [variantCounts, setVariantCounts] = useState(null);
  const channelRef = useRef(null);
  const variantLabels = useMemo(() => getExamVariantLabels(exam), [exam]);
  const activeClassName = useMemo(() => {
    const hit = classList.find(c => c.key === activeClassKey);
    return hit?.name || displayClassName(activeClassKey, activeClassKey);
  }, [classList, activeClassKey]);

  const matchClass = useCallback((payload) => {
    if (!activeClassKey) return true;
    if (payload?.classKey) return payload.classKey === activeClassKey;
    const clsRaw = typeof payload === 'string' ? payload : (payload?.cls || '');
    const k = normalizeClassKey(clsRaw);
    return k === activeClassKey || (clsRaw || '').trim() === activeClassName;
  }, [activeClassKey, activeClassName]);

  const addJoin = useCallback((payload, id) => {
    if (!payload?.name || !matchClass(payload)) return;
    setJoins(prev => {
      const key = id || (payload.name + '|' + (payload.cls || '') + '|' + (payload.at || ''));
      if (prev.some(p => p.id === key)) return prev;
      return [{ id: key, name: payload.name, cls: payload.cls || activeClassName, at: payload.at || Date.now() }, ...prev].slice(0, 30);
    });
  }, [matchClass, activeClassName]);

  // Firebase: бүртгэлтэй ангиуд + сүүлийн ангиар шууд QR
  useEffect(() => {
    if (!exam?.id) return;
    const db = getDb();
    // Backfill clientPack so QR students load in 1 RTDB read
    try {
      const teacher = ensureTeacherAuth();
      if (db && teacher) {
        const versions = {};
        normalizeVariants(exam).forEach(v => {
          const qs = (v.questions || []).filter(q => (q.text || '').trim());
          if (qs.length) versions[v.label || 'A'] = packQuestions(qs);
        });
        if (Object.keys(versions).length) {
          roomRef(db, exam.id).child('clientPack')
            .set(buildClientPack({ ...exam, ownerUid: teacher.uid, id: exam.id }, versions))
            .catch(() => {});
        }
      }
    } catch {}
    const lastKey = (() => { try { return localStorage.getItem(lastQrClassStorageKey(exam.id)); } catch { return ''; } })();
    if (!db) {
      if (lastKey) {
        setActiveClassKey(lastKey);
        setClassList([{ key: lastKey, name: displayClassName(lastKey, lastKey) }]);
        setStep('qr');
      }
      return;
    }
    const ref = roomRef(db, exam.id).child('classes');
    const handler = ref.on('value', snap => {
      const val = snap.val() || {};
      const list = Object.entries(val).map(([key, v]) => ({
        key,
        name: (v && v.name) ? v.name : key
      })).sort((a, b) => a.name.localeCompare(b.name, 'mn'));
      setClassList(list);
      const pick = (lastKey && list.some(c => c.key === lastKey)) ? lastKey : (list[0]?.key || '');
      if (pick) {
        setActiveClassKey(pick);
        setStep('qr');
      }
    });
    return () => { try { ref.off('value', handler); } catch {} };
  }, [exam?.id]);

  const goQrForClass = useCallback(async (name) => {
    setSavingClass(true);
    try {
      const reg = await registerExamClass(exam.id, name);
      setActiveClassKey(reg.key);
      setClassInput('');
      setStep('qr');
    } catch (e) {
      alert(e.message || 'Алдаа');
    } finally {
      setSavingClass(false);
    }
  }, [exam?.id]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    try {
      const bc = new BroadcastChannel('se_join_' + exam.id + '_' + activeClassKey);
      channelRef.current = bc;
      bc.onmessage = (ev) => {
        if (ev?.data?.type === 'JOIN') addJoin(ev.data.payload, ev.data.payload?.id);
      };
      return () => { try { bc.close(); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey) return;
    const db = getDb();
    if (!db) return;
    setJoins([]);
    try {
      const ref = roomRef(db, exam.id).child('joins').limitToLast(80);
      const onAdd = ref.on('child_added', snap => addJoin(snap.val(), snap.key));
      return () => { try { ref.off('child_added', onAdd); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, addJoin]);

  useEffect(() => {
    if (!exam?.id || !activeClassKey || variantLabels.length < 2) { setVariantCounts(null); return; }
    const db = getDb();
    if (!db) return;
    try {
      const ref = roomRef(db, exam.id).child('variantAllocator').child(activeClassKey).child('counts');
      const handler = ref.on('value', snap => setVariantCounts(snap.val() || {}));
      return () => { try { ref.off('value', handler); } catch {} };
    } catch {}
  }, [exam?.id, activeClassKey, variantLabels.length]);

  useEffect(() => {
    if (step !== 'qr' || !qrRef.current || !activeClassKey) return;
    qrRef.current.innerHTML = '';
    try {
      const base = window.location.origin + window.location.pathname;
      const packed = packExamForQR(exam, activeClassKey);
      const data = LZString.compressToEncodedURIComponent(JSON.stringify(packed));
      const url = base + '#qr=' + data;
      new QRCode(qrRef.current, {
        text: url,
        width: 240, height: 240,
        colorDark: '#1e293b', colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.L
      });
    } catch(e) { qrRef.current.innerHTML = '<div style="color:red">QR үүсгэхэд алдаа гарлаа</div>'; }
  }, [step, activeClassKey, exam?.id]);

  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" style={{maxWidth:480}}>
        {step === 'confirm' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 QR код үүсгэх</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.95rem',marginBottom:12}}>
                <strong>"{exam.title}"</strong> шалгалтын QR кодыг үүсгэх үү?
              </div>
              <div style={{fontSize:'0.85rem',color:'var(--text2)',lineHeight:1.7,marginBottom:16}}>
                Сурагчид QR уншуулахад зөвхөн <strong>нэр</strong> бичнэ.<br/>
                Ангиа багш энд томилно.
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 7а, 8б, 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={onClose}>Болих</button>
              <button
                className="btn btn-primary"
                disabled={!classInput.trim() || savingClass}
                onClick={() => goQrForClass(classInput)}
              >
                {savingClass ? '⏳ ...' : '✓ Тийм, үүсгэх'}
              </button>
            </div>
          </>
        ) : step === 'addClass' ? (
          <>
            <div className="modal-head">
              <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>➕ Өөр анги</div>
            </div>
            <div className="modal-body">
              <div style={{fontSize:'0.85rem',color:'var(--text2)',marginBottom:14,lineHeight:1.6}}>
                Ижил шалгалтын материалаар өөр ангид QR үүсгэнэ (жн: 9а).
              </div>
              <div className="form-group">
                <label className="form-label">Ангийн нэр</label>
                <input
                  className="form-input"
                  placeholder="жн: 9а"
                  value={classInput}
                  onChange={e => setClassInput(e.target.value)}
                  onKeyDown={e => e.key === 'Enter' && classInput.trim() && goQrForClass(classInput)}
                  autoFocus
                />
              </div>
            </div>
            <div className="modal-foot">
              <button className="btn btn-outline" onClick={() => { setClassInput(''); setStep(activeClassKey ? 'qr' : 'confirm'); }}>Болих</button>
              <button className="btn btn-primary" disabled={!classInput.trim() || savingClass} onClick={() => goQrForClass(classInput)}>
                ✓ QR үүсгэх
              </button>
            </div>
          </>
        ) : (
          <>
            <div className="modal-head" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:12}}>
              <div>
                <div style={{fontFamily:'Outfit',fontWeight:800,fontSize:'1.1rem'}}>📱 {exam.title}</div>
                <div style={{fontSize:'0.8rem',color:'var(--text2)',marginTop:4}}>
                  <span style={{background:'var(--violet-light)',color:'var(--violet)',padding:'3px 10px',borderRadius:20,fontWeight:800}}>
                    {activeClassName} анги
                  </span>
                  {' '}· Сурагч зөвхөн нэрээ бичнэ
                </div>
              </div>
              <button className="btn btn-outline btn-sm" style={{flexShrink:0}} onClick={() => { setClassInput(''); setStep('addClass'); }}>
                Өөр анги
              </button>
            </div>
            <div className="modal-body" style={{textAlign:'center',padding:'28px 24px'}}>
              <div className="qr-wrap" style={{marginBottom:16}}>
                <div ref={qrRef} />
              </div>

              {classList.length > 1 && (
                <div style={{display:'flex',flexWrap:'wrap',gap:6,justifyContent:'center',marginBottom:12}}>
                  {classList.map(c => (
                    <button
                      key={c.key}
                      type="button"
                      className={`btn btn-sm ${c.key === activeClassKey ? 'btn-violet' : 'btn-outline'}`}
                      onClick={() => {
                        setActiveClassKey(c.key);
                        try { localStorage.setItem(lastQrClassStorageKey(exam.id), c.key); } catch {}
                        setJoins([]);
                      }}
                    >
                      {c.name}
                    </button>
                  ))}
                </div>
              )}

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,margin:'0 auto 10px',maxWidth:360}}>
                <div style={{fontSize:'0.82rem',color:'var(--text2)',textAlign:'left'}}>
                  👥 {activeClassName} орсон: <strong style={{color:'var(--text)'}}>{joins.length}</strong>
                </div>
                <div style={{fontSize:'0.78rem',color:'var(--text3)'}}>Нэр бичсэн сурагчид</div>
              </div>

              {joins.length > 0 && (
                <div style={{maxWidth:360,margin:'0 auto 14px',textAlign:'left',border:'1px solid var(--border)',borderRadius:12,overflow:'hidden'}}>

                      <div style={{fontWeight:700,fontSize:'0.85rem',color:'var(--text)'}}>{j.name}</div>
                    </div>
                  ))}
                </div>
              )}

              <div style={{fontSize:'0.82rem',color:'var(--text2)',marginTop:8}}>
                ❓ {(() => { const vs = exam?.versions; if (vs && typeof vs === 'object') { const v = Object.values(vs); return v.length > 0 ? (v[0]||[]).length : 0; } return (normalizeVariants(exam)[0]?.questions||[]).length; })()} асуулт &nbsp;·&nbsp; ⏱ {exam.duration} мин
                {variantLabels.length > 1 && <span style={{marginLeft:8,background:'var(--violet-light)',color:'var(--violet)',borderRadius:12,padding:'2px 8px',fontSize:'0.75rem',fontWeight:700}}>🎯 хувилбар тэнцүү</span>}
