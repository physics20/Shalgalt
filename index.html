  const unpackQuestionsPublic = (questions) =>
    (questions || []).map((q, idx) => {
      const type = q?.type || 'mcq';
      let options;
      if (type === 'tf') {
        options = [
          { key: 'A', text: q?.options?.[0]?.text || 'Зөв / Үнэн' },

.exam-card-meta span { display: flex; align-items: center; gap: 4px; }
.exam-card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

/* ─── STEP INDICATOR ─────────────────────────── */
.steps { display: flex; gap: 0; margin-bottom: 28px; }
.step {
  flex: 1;
  display: flex;
  align-items: center;
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text3);
}
.step.active { color: var(--primary); }
.step.done { color: var(--green); }
.step-num {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--border);
  color: var(--text3);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.75rem; font-weight: 700;
  margin-right: 8px;
  flex-shrink: 0;
}
.step.active .step-num { background: var(--primary); color: white; }
.step.done .step-num { background: var(--green); color: white; }
.step-line { flex: 1; height: 1px; background: var(--border); margin: 0 10px; }
.step:last-child .step-line { display: none; }

/* ─── PDF IMPORT ─────────────────────────────── */
.ai-hint-box {
  background: linear-gradient(135deg, var(--violet-light), #f0f4ff);
  border: 1.5px solid #d8c8ff;
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  margin-bottom: 18px;
}
.ai-icon { font-size: 1.3rem; flex-shrink: 0; margin-top: 1px; }
.ai-hint-text { font-size: 0.85rem; color: #4c3db0; line-height: 1.5; min-width: 0; }
.ai-hint-text strong { color: var(--violet); }
.inline-ai-panel {
  background: linear-gradient(135deg, var(--violet-light), #eef2ff);
  border: 1.5px solid #c4b5fd;
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 16px;
}
.inline-ai-panel .form-textarea { background: white; }

.parsing-overlay {
  text-align: center;
  padding: 48px 24px;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid var(--violet-light);
  border-top-color: var(--violet);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── QUESTION PREVIEW ───────────────────────── */
.question-item {
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  background: white;
  margin-bottom: 12px;
  transition: border-color .15s;
}
.question-item:hover { border-color: var(--primary); }
.q-num { display: inline-block; background: var(--primary-light); color: var(--primary); font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 12px; margin-bottom: 8px; }
.q-text { font-size: 0.9rem; color: var(--text); line-height: 1.6; margin-bottom: 12px; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.option-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  background: var(--surface2);
  font-size: 0.82rem;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .12s;
}
.option-item.correct { background: var(--green-light); border-color: #6ee7b7; }
.option-key {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: white;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--text2);
  flex-shrink: 0;
  margin-top: 1px;
}
.option-item.correct .option-key { background: var(--green); border-color: var(--green); color: white; }

/* ─── ANSWER SELECT ──────────────────────────── */
.answer-select-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
}
.answer-label { font-size: 0.78rem; color: var(--text2); font-weight: 600; }
.ans-btn {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  background: white;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
  transition: all .12s;
  display: flex; align-items: center; justify-content: center;
  color: var(--text2);
}
.ans-btn.selected { background: var(--green); border-color: var(--green); color: white; }
.ans-btn:hover:not(.selected) { border-color: var(--primary); color: var(--primary); }

/* ─── STUDENT EXAM ───────────────────────────── */
.exam-header-bar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 14px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 60px;
  z-index: 50;
}
.exam-title-bar { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1rem; }
.timer-badge {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 20px;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 0.95rem;
  background: var(--primary-light);
  color: var(--primary);
}
.timer-badge.warn { background: var(--amber-light); color: var(--amber); }
.timer-badge.danger { background: var(--red-light); color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.7; } }

.exam-question-wrapper {
  padding: 24px 0;
}
.question-block {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 14px;
  transition: border-color .15s;
}
.question-block.answered { border-color: #a5f3d8; }
.student-option {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--surface2);
  border: 1.5px solid var(--border);
  cursor: pointer;
  margin-bottom: 7px;
  font-size: 0.875rem;
  transition: all .15s;
  text-align: left;
  width: 100%;
}
.student-option:hover { border-color: var(--primary); background: var(--primary-light); }
.student-option.selected { border-color: var(--primary); background: var(--primary-light); }
.student-option.correct-show { border-color: var(--green); background: var(--green-light); }
.student-option.wrong-show { border-color: var(--red); background: var(--red-light); }
.opt-radio {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid var(--border);
  flex-shrink: 0;
  margin-top: 1px;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.student-option.selected .opt-radio { border-color: var(--primary); background: var(--primary); }
.student-option.selected .opt-radio::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: white; }
.student-option.correct-show .opt-radio { border-color: var(--green); background: var(--green); }
.student-option.wrong-show .opt-radio { border-color: var(--red); background: var(--red); }

/* ─── PROGRESS BAR ───────────────────────────── */
.progress-bar-wrap { background: var(--border); border-radius: 6px; height: 6px; overflow: hidden; margin-bottom: 6px; }
.progress-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--primary), var(--violet)); transition: width .3s ease; }

/* ─── RESULT PAGE ────────────────────────────── */
.result-hero {
  text-align: center;
  padding: 36px 24px 28px;
  background: linear-gradient(135deg, #eef2ff, #f5f0ff);
  border-radius: var(--radius);
  margin-bottom: 24px;
}
.score-circle {
  width: 110px; height: 110px;
  border-radius: 50%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin: 0 auto 16px;
  font-family: 'Outfit', sans-serif;
}
.score-circle.pass { background: linear-gradient(135deg, #d1fae5, #a7f3d0); border: 4px solid var(--green); }
.score-circle.fail { background: linear-gradient(135deg, #fee2e2, #fecaca); border: 4px solid var(--red); }
.score-circle.pending { background: linear-gradient(135deg, #fef3c7, #fde68a); border: 4px solid #f59e0b; }
.score-circle.pending .score-pct { color: #b45309; }
.score-pct { font-size: 2rem; font-weight: 900; line-height: 1; }
.score-circle.pass .score-pct { color: var(--green); }
.score-circle.fail .score-pct { color: var(--red); }
.score-label { font-size: 0.7rem; font-weight: 600; color: var(--text2); }

/* ─── SUBMISSIONS TABLE ──────────────────────── */
.sub-table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
.sub-table th {
  padding: 10px 14px;
  background: var(--surface2);
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .5px;
  color: var(--text2);
  text-align: left;
  border-bottom: 2px solid var(--border);
}
.sub-table td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text); }
.sub-table tr:last-child td { border-bottom: none; }
.sub-table tr:hover td { background: var(--surface2); }

/* ─── SETTINGS MODAL ─────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(15,15,35,.45);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 999;
  padding: 20px;
}
.modal {
  background: white;
  border-radius: 20px;
  width: 100%;
  max-width: 500px;
  box-shadow: 0 20px 60px rgba(0,0,0,.18);
  animation: modalIn .2s ease;
}
@keyframes modalIn { from { opacity:0; transform:scale(.96) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
.modal-head {
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--border);
}
.modal-body { padding: 22px 24px; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 10px; }

/* ─── EMPTY STATE ────────────────────────────── */
.empty-state {
  text-align: center;
  padding: 56px 24px;
  color: var(--text2);
}
.empty-icon { font-size: 3rem; margin-bottom: 12px; opacity: .6; }
.empty-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.1rem; color: var(--text); margin-bottom: 6px; }
.empty-sub { font-size: 0.875rem; margin-bottom: 20px; }

/* ─── STATS STRIP ────────────────────────────── */
.stats-strip { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 24px; }
.stat-card {
  flex: 1; min-width: 130px;
  background: white;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}
.stat-val { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.8rem; line-height: 1; color: var(--text); }
.stat-lbl { font-size: 0.78rem; color: var(--text2); font-weight: 600; margin-top: 4px; }

/* ─── MISC ───────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.text-sm { font-size: 0.85rem; }
.text-muted { color: var(--text2); }
.flex { display: flex; }
.flex-center { display: flex; align-items: center; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.mt-1 { margin-top: 4px; }
.mt-2 { margin-top: 8px; }
.mt-3 { margin-top: 12px; }
.mb-2 { margin-bottom: 8px; }
.mb-3 { margin-bottom: 14px; }
.mb-4 { margin-bottom: 20px; }
.text-right { text-align: right; }
.fw-bold { font-weight: 700; }

/* ─── API KEY BANNER ─────────────────────────── */



/* ─── CHEAT WARNING ──────────────────────────────── */
.cheat-warning {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e293b;
  color: white;
  padding: 12px 22px;
  border-radius: 40px;
  font-size: 0.9rem;
  font-weight: 600;
  z-index: 9999;
  box-shadow: 0 8px 32px rgba(0,0,0,.3);
  display: flex;
  align-items: center;
  gap: 10px;
  animation: slideDown .25s ease;
  white-space: nowrap;
}
@keyframes slideDown { from { opacity:0; transform:translateX(-50%) translateY(-12px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
.cheat-badge {
  background: #dc2626;
  color: white;
  border-radius: 20px;
  padding: 3px 10px;
  font-size: 0.75rem;
  font-weight: 700;
}
.cheat-overlay {
  position: fixed;
  inset: 0;
  background: rgba(220,38,38,.18);
  pointer-events: none;
  z-index: 8888;
  animation: flash .4s ease;
}
@keyframes flash { 0%,100% { opacity:0; } 50% { opacity:1; } }

/* ─── QR MODAL ───────────────────────────────────── */
.qr-wrap {
  display: inline-block;
  padding: 18px;
  background: white;
  border-radius: 16px;
  border: 2px solid var(--border);
  box-shadow: var(--shadow-lg);
}
.cheat-row-bad { background: #fff5f5 !important; }
.cheat-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 700;
  cursor: pointer;
}
.cheat-pill-0 { background: var(--green-light); color: var(--green); }
.cheat-pill-warn { background: var(--amber-light); color: var(--amber); }
.cheat-pill-danger { background: var(--red-light); color: var(--red); }
.cheat-detail-modal { max-height: 380px; overflow-y: auto; }
.cheat-event {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.82rem;
}
.cheat-event:last-child { border-bottom: none; }

/* Шалгалтын үе — pinch zoom багасгах */
.exam-taking-root {
  touch-action: manipulation;
}
.exam-taking-root input, .exam-taking-root textarea, .exam-taking-root select {
  font-size: 16px;
}

/* ─── VERSION INDICATOR ──────────────────────── */
.version-indicator {
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(135deg, var(--violet-light), #eef2ff);
  border: 2px solid #c4b5fd;
  border-radius: var(--radius);
  padding: 14px 18px;
  margin-bottom: 18px;
}
.version-indicator-icon {
  width: 42px; height: 42px;
  border-radius: 12px;
  background: var(--violet);
  color: white;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-weight: 900;
  font-size: 1.2rem;
  flex-shrink: 0;
}
.version-indicator-text { flex: 1; }
.version-indicator-label {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  color: #4c1d95;
}
.version-indicator-sub {
  font-size: 0.78rem;
  color: #6d28d9;
  margin-top: 2px;
}
.version-tab-strip {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding: 10px 14px;
  background: var(--surface2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
}
.version-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.82rem;
  font-weight: 700;
  cursor: pointer;
  border: 1.5px solid var(--border);
  background: white;
  color: var(--text2);
  transition: all .15s;
  font-family: 'Outfit', sans-serif;
}
.version-tab:hover { border-color: var(--violet); color: var(--violet); }
.version-tab.active {
  background: var(--violet);
  border-color: var(--violet);
  color: white;
  box-shadow: 0 2px 8px rgba(124,58,237,.3);
}
.version-tab .vtab-count {
  background: rgba(255,255,255,.25);
  border-radius: 10px;

}
.version-tab:not(.active) .vtab-count {
  background: var(--border);

}
.version-next-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 8px 18px;
  background: linear-gradient(135deg, var(--violet), #6d28d9);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  font-weight: 600;

}
.version-next-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(124,58,237,.4); }
.version-next-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }


.variant-stats-strip {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.variant-stat-chip {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--violet-light);
  border: 1.5px solid #ddd6fe;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--violet);
}
.variant-stat-chip .chip-label {
  font-family: 'Outfit', sans-serif;
  font-weight: 800;
}

@media (max-width: 720px) {
  .form-row { grid-template-columns: 1fr; }
  .options-grid { grid-template-columns: 1fr; }
  .exam-grid { grid-template-columns: 1fr; }
  .landing-title { font-size: 2rem; }
  .stats-strip { flex-direction: column; }
  .role-cards { flex-direction: column; }
  .role-card { width: 100%; max-width: 320px; }
  .steps { flex-wrap: wrap; gap: 6px; }
  .step-line { display: none; }
}

/* ─── OMR ANSWER SHEET (PRINT) ───────────────────────────────────────────── */


















@media print {
  body * { visibility: hidden; }
  
  
  
  
  .no-print { display: none !important; }
}

/* ─── SUBJECT CARDS (Create Exam Step 1) ─────────────────────────────────── */
.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
@media (max-width: 640px) {
  .subject-grid { grid-template-columns: repeat(2, 1fr); }
}
.subject-card {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  padding: 18px 12px; border-radius: 14px; border: 2px solid var(--border);
  background: white; cursor: pointer; transition: all .18s ease;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.88rem;
  color: var(--text); text-align: center;
}
.subject-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.subject-card.selected {
  border-color: var(--subject-color, var(--primary));
  background: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(59,91,219,.15);
}
.subject-card-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem;
  background: var(--surface2);
}
.subject-card-fmt {
  font-family: 'DM Sans', sans-serif; font-size: 0.68rem; font-weight: 500;
  color: var(--text3); line-height: 1.3;
}

/* ─── FORMAT PREVIEW CARDS ───────────────────────────────────────────────── */
.format-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
@media (max-width: 640px) { .format-grid { grid-template-columns: 1fr; } }
.format-card {
  padding: 16px; border-radius: 12px; border: 2px solid var(--border);
  background: white; cursor: pointer; transition: all .15s;
}
.format-card:hover { border-color: var(--primary); }
.format-card.selected { border-color: var(--primary); background: var(--primary-light); }
.format-card-title { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; }
.format-card-desc { font-size: 0.78rem; color: var(--text2); line-height: 1.45; }

/* ─── TRUE/FALSE & GRID-IN UI ────────────────────────────────────────────── */
.tf-options { display: flex; gap: 10px; flex-wrap: wrap; }
.tf-btn {
  flex: 1; min-width: 140px; padding: 14px 18px; border-radius: 12px;
  border: 2px solid var(--border); background: white; cursor: pointer;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem;
  transition: all .15s; text-align: center;
}
.tf-btn.true:hover, .tf-btn.true.selected { border-color: var(--green); background: var(--green-light); color: var(--green); }
.tf-btn.false:hover, .tf-btn.false.selected { border-color: var(--red); background: var(--red-light); color: var(--red); }
.grid-in-row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.grid-in-col {
  display: flex; flex-direction: column; gap: 3px; align-items: center;
}
.grid-in-digit {
  width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; font-weight: 700; cursor: pointer; background: white;
  transition: all .1s;
}
.grid-in-digit.filled { background: var(--primary); border-color: var(--primary); color: white; }
.grid-in-preview {
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.2rem;
  color: var(--primary); margin-top: 8px;
}
.source-box {
  background: var(--amber-light); border: 1.5px solid #fcd34d; border-radius: 10px;
  padding: 12px 14px; margin-bottom: 12px; font-size: 0.88rem; color: #92400e; line-height: 1.55;
}
.q-image-wrap {
  margin-bottom: 12px; border-radius: 10px; overflow: hidden;

<script type="text/babel">
const { useState, useEffect, useCallback, useRef, useMemo } = React;

// ─── UTILS ────────────────────────────────────────────────────────────────────
const uid = () => (window.SESecurity ? SESecurity.secureUid(12) : (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)));
const sanitizeText = (s, max) => (window.SESecurity ? SESecurity.sanitizeText(s, max) : String(s || '').slice(0, max || 500));
const escapeHtml = (s) => (window.SESecurity ? SESecurity.escapeHtml(s) : String(s || ''));

const getAuth = () => {
  const app = getFirebaseApp();
  if (!app) return null;
  try { return firebase.auth(app); } catch { return null; }
};

const getFunctions = () => {
  const app = getFirebaseApp();
  if (!app || !firebase.functions) return null;
  try {
    return app.functions('asia-southeast1');
  } catch {
    try { return firebase.functions(app); } catch { return null; }
  }
};

const ensureStudentAuth = async () => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй');
  // Reuse Safari/Chrome early warm promise when available
  if (window.__SE_AUTH_WARM__) {
    try {
      const u = await window.__SE_AUTH_WARM__;
      if (u || auth.currentUser) return auth.currentUser || u;
    } catch {}
  }
  try { if (auth.authStateReady) await auth.authStateReady(); } catch {}
  if (auth.currentUser) return auth.currentUser;
  try { await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); } catch {}
  const cred = await auth.signInAnonymously();
  return cred.user;
};

/** Warm anonymous auth early so QR/code join is instant */
const prefetchStudentAuth = () => {
  try {
    if (window.__SE_AUTH_WARM__) return window.__SE_AUTH_WARM__;
    const p = ensureStudentAuth().catch(() => null);
    window.__SE_AUTH_WARM__ = p;
    return p;
  } catch { return Promise.resolve(null); }
};

const ensureTeacherAuth = () => {
  const auth = getAuth();
  const u = auth?.currentUser;
  if (!u || u.isAnonymous) return null;
  try { if (localStorage.getItem('se_role') === 'student') return null; } catch {}
  return u;
};

const teacherSignIn = async (email, password) => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй. Интернетээ шалгана уу.');
  const cred = await auth.signInWithEmailAndPassword(String(email).trim(), password);
  try {
    const r = (await withAuthRetry(() => getDb().ref('users/' + cred.user.uid + '/role').once('value'))).val();
    if (r === 'student') { await auth.signOut(); throw new Error('Энэ сурагчийн акаунт байна. Сурагчаар нэвтэрнэ үү.'); }
  } catch (e) { if (String(e.message).includes('сурагчийн')) throw e; }
  try { localStorage.setItem('se_role', 'teacher'); } catch {}
  return cred.user;
};

const teacherSignUp = async (email, password, displayName) => {
  const auth = getAuth();
  if (!auth) throw new Error('Firebase Auth холбогдоогүй');
  const cred = await auth.createUserWithEmailAndPassword(String(email).trim(), password);
  if (displayName) {
    try { await cred.user.updateProfile({ displayName: sanitizeText(displayName, 80) }); } catch {}
  }
  try { localStorage.setItem('se_role', 'teacher'); } catch {}
  const db = getDb();
  if (db) {
    try {
      await withAuthRetry(() => db.ref('users/' + cred.user.uid).set({ role: 'teacher', name: sanitizeText(displayName || email.split('@')[0], 80) }));
      await db.ref('teachers/' + cred.user.uid).set({
        displayName: sanitizeText(displayName || email.split('@')[0], 80),
        email: String(email).trim().toLowerCase(),
        createdAt: new Date().toISOString()
      });
    } catch {}
  }
  return cred.user;
};

const teacherSignOut = async () => {
  const auth = getAuth();
  try { if (window.SESecurity) SESecurity.clearTeacherMeta(); localStorage.removeItem('se_role'); } catch {}
  if (auth) await auth.signOut();
};

// Cloud Function ашигладаггүй тул дүгнэлтийг хөтөч дээр хийнэ (answerKeys-ийг Realtime DB-ээс уншина)
const callGradeSubmission = async (payload) => {
  const db = getDb();
  if (!db) throw new Error('Firebase холбогдоогүй');
  const room = roomRef(db, payload.roomId);
  const keySnap = await room.child('answerKeys').once('value');
  const allKeys = keySnap.val();
  if (!allKeys) throw new Error('Answer key уншигдсангүй (DB rules шалгана уу)');
  const label = payload.variantLabel;
  const rawKeys = allKeys[label] || allKeys[Object.keys(allKeys)[0]];
  const keyList = (Array.isArray(rawKeys) ? rawKeys : Object.values(rawKeys || {})).filter(Boolean);
  const subset = Array.isArray(payload.subset) ? payload.subset : null;
  const ans = payload.answers || {};
  const norm = v => String(v ?? '').trim().toUpperCase();
  const num = v => String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  let correct = 0, total = 0;
  const wrongIds = [];
  keyList.forEach(q => {
    if (q.answer == null || q.answer === '') return;
    if (subset && !subset.includes(q.id)) return;
    total++;
    const ok = q.type === 'grid'
      ? !!num(ans[q.id]) && num(ans[q.id]) === num(q.answer)
      : norm(ans[q.id]) === norm(q.answer);
    if (ok) correct++; else wrongIds.push(q.id);
  });
  if (!total) throw new Error('Зөв хариултын түлхүүр хоосон байна');
  const score = Math.round((correct / total) * 100);
  const id = uid();
  // Алдсан асуултаа дахин ажиллах үед өрөөний дүнд нэмэхгүй
  if (!subset) {
    try {
      await room.child('submissions').child(id).set({
        id, uid: getAuth()?.currentUser?.uid || null,
        examId: payload.roomId, answers: ans, score, correctCount: correct, totalCount: total,
        studentName: payload.studentName || '', studentClass: payload.studentClass || '',
        variantLabel: label, studentVersion: label,
        cheatLog: payload.cheatLog || [], timeSpentSec: payload.timeSpentSec || 0,
        submittedAt: new Date().toISOString(), verified: true, gradedBy: 'client'
      });
    } catch (e) { console.warn('submission save failed', e); }
  }
  return { id, score, correctCount: correct, totalCount: total, wrongIds };
};

const useLS = (key, init) => {
  const [val, setVal] = useState(() => {
    try {
      const s = localStorage.getItem(key);
      return s ? JSON.parse(s) : init;
    } catch { return init; }
  });
  const set = useCallback(v => {
    setVal(prev => {
      const next = typeof v === 'function' ? v(prev) : v;
      try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
      return next;
    });
  }, [key]);
  return [val, set];
};

const fmt = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const fmtDur = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const r = s % 60;
  if (h > 0) return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
};

// ─── FIREBASE (built-in config) ───────────────────────────────────────────────
// Default Firebase config is embedded in code (no manual setup needed).
// You can still override it by setting localStorage key: se_firebase_config
const FIREBASE_DEFAULT_CONFIG = (typeof window !== 'undefined' && window.__SE_FB_CONFIG__) || {
  apiKey: "AIzaSyCNWh5yXA3RAzPNCifGXhihAOXhYboIIWY",
  authDomain: "shalgalt-6933b.firebaseapp.com",
  projectId: "shalgalt-6933b",
  storageBucket: "shalgalt-6933b.firebasestorage.app",

};

const getFirebaseConfig = () => {
  try {
    const raw = localStorage.getItem('se_firebase_config');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.apiKey && parsed.projectId && (parsed.databaseURL || parsed.databaseUrl) && parsed.authDomain) {
        return parsed;
      }
    }
  } catch {}
  return FIREBASE_DEFAULT_CONFIG;
};
const hasFirebaseConfig = () => {
  const cfg = getFirebaseConfig();
  return !!(cfg && cfg.apiKey && cfg.projectId && (cfg.databaseURL || cfg.databaseUrl));
};
const getFirebaseApp = (() => {
  let app = null;
  return () => {
    if (app) return app;
    const cfg = getFirebaseConfig();
    if (!cfg) return null;
    const fixed = { ...cfg, databaseURL: cfg.databaseURL || cfg.databaseUrl };
    try {
      if (firebase.apps && firebase.apps.length) {
        app = firebase.app();
        return app;
      }
      app = firebase.initializeApp(fixed);
      return app;
    } catch (e) {
      try { app = firebase.app(); return app; } catch { return null; }
    }
  };
})();
let __dbInit = false;
const getDb = () => {
  const app = getFirebaseApp();
  if (!app) return null;
  try {
    const d = firebase.database(app);
    if (!__dbInit) {
      __dbInit = true;
      try { d.goOnline(); } catch (e) {}
      // WebSocket саатвал long-polling руу автоматаар шилжинэ (локал/content:// үед)
      try { if (location.protocol !== 'https:' && firebase.database.INTERNAL && firebase.database.INTERNAL.forceLongPolling) firebase.database.INTERNAL.forceLongPolling(); } catch (e) {}
    }
    return d;
  } catch { return null; }
};
const deviceId = (() => {
  const k = 'se_device_id';
  const existing = localStorage.getItem(k);
  if (existing) return existing;
  const id = uid();
  try { localStorage.setItem(k, id); } catch {}
  return id;
})();

const alpha = (i) => String.fromCharCode(65 + (i % 26));

const normalizeVariants = (exam) => {
  // New format: exam.variants = [{label:'A', questions:[...]}]
  if (Array.isArray(exam?.variants) && exam.variants.length) {
    return exam.variants.map((v, idx) => ({
      label: v.label || alpha(idx),
      questions: Array.isArray(v.questions) ? v.questions : []
    }));
  }
  // Backward-compat: older exam only had questions (or variantOrders shuffle)
  if (Array.isArray(exam?.questions) && exam.questions.length) {
    return [{ label: 'A', questions: exam.questions }];
  }
  return [{ label: 'A', questions: [] }];
};


// Auth token DB-д шилжихийг хүлээж, PERMISSION_DENIED үед дахин оролдоно
const withAuthRetry = async (fn) => {
  try { const u = getAuth()?.currentUser; if (u) await u.getIdToken(true); } catch {}
  for (let i = 0; i < 5; i++) {
    try {
      return await Promise.race([
        fn(),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Realtime Database-тэй холбогдсонгүй. Интернетээ шалгаад дахин оролдоно уу. Файлыг content:// эсвэл file:// -ээс биш, https:// хаягаар (Firebase Hosting) нээнэ үү.')), 25000))
      ]);
    }
    catch (e) {
      const m = (e && (e.code || e.message)) || '';
      if (!/PERMISSION_DENIED|permission.?denied/i.test(m) || i === 4) throw e;
      await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
};
const roomRef = (db, roomID) => db.ref('activeRooms/' + roomID);
const packQuestions = (questions) => {
  if (window.SESecurity) return SESecurity.packQuestionsPublic(questions);
  return (questions || []).map(q => ({
    text: q.text || '',
    options: (q.options || []).map(o => ({ key: o.key, text: o.text || '' })),
    type: q.type || 'mcq',
    topic: q.topic || '',
    imageUrl: q.imageUrl || '',
    sourceText: q.sourceText || '',
    audioUrl: q.audioUrl || '',
    unit: q.unit || '',
    left: q.type === 'match' ? (q.left || []).slice(0, 10) : []
  }));
};
const packAnswerKeys = (questions) => {
  if (window.SESecurity) return SESecurity.packAnswerKeys(questions);
  return (questions || []).map((q, i) => ({
    id: i + 1,
    type: q.type || 'mcq',
    answer: q.answer ?? q.numericAnswer ?? null,
    topic: q.topic || ''
  }));
};
const unpackQuestions = (questions) => {
  if (window.SESecurity) return SESecurity.unpackQuestionsPublic(questions);
  return (questions || []).map((q, idx) => {
  const type = q?.type || 'mcq';
  let options;
  if (type === 'tf') {
    options = [
      { key: 'A', text: q?.options?.[0]?.text || 'Зөв / Үнэн' },
      { key: 'B', text: q?.options?.[1]?.text || 'Буруу / Худал' }
    ];
  } else if (type === 'grid') {
    options = [];
  } else if (type === 'match') {
    options = (Array.isArray(q?.options) ? q.options : Object.values(q?.options || {})).map((o, oi) => ({ key: o?.key || 'ABCDEFGH'[oi], text: o?.text || '' }));
  } else {
    options = ['A', 'B', 'C', 'D'].map((key, oi) => {
      const hit = (q?.options || []).find(o => o?.key === key);
      const byIndex = q?.options?.[oi];
      return { key, text: (hit?.text ?? byIndex?.text ?? '') };
    });
  }
  return {
    id: idx + 1,
    text: q?.text || '',
    left: type === 'match' ? (Array.isArray(q?.left) ? q.left : Object.values(q?.left || {})).map(t => String(t || '')) : [],
    options,
    answer: null,
    type,
    topic: q?.topic || '',
    imageUrl: q?.imageUrl || '',
    sourceText: q?.sourceText || '',
    audioUrl: q?.audioUrl || '',
    unit: q?.unit || '',
    numericAnswer: null
  };
  });
};

// ─── ХОЛБОХ ДАСГАЛ (matching) ─────────────────────────────────────────────────
// q.left = зүүн талын зүйлс (1,2,3...), q.options = баруун талын сонголтууд (A..H, харагдах нь А,Б,В,Г...)
// Хариулт: зүүн зүйл бүрт харгалзах үсгийг таслалаар нийлүүлсэн мөр. Жишээ: "B,A,D,C"
const MATCH_LABELS = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З'];
const matchLabel = (key) => MATCH_LABELS['ABCDEFGH'.indexOf(key)] || key;
const matchToArr = (v, n) => {
  const a = String(v == null ? '' : v).split(',').map(x => x.trim().toUpperCase());
  while (a.length < n) a.push('');
  return a.slice(0, n);
};

const answersEqual = (got, expected, type) => {
  if (expected == null || expected === '') return false;
  const g = String(got ?? '').trim().toUpperCase();
  const e = String(expected).trim().toUpperCase();
  if (type === 'grid') {
    const nz = (v) => String(v ?? '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
    const gn = nz(got), en = nz(expected);
    return gn.length > 0 && en.length > 0 && gn === en;
  }
  return g === e;
};

const csvCell = (v) => {
  const s = (v ?? '').toString();
  const escaped = s.replace(/"/g, '""');
  return `"${escaped}"`;
};
const downloadCSV = (filename, rows) => {
  const bom = '\uFEFF'; // Excel UTF-8 BOM
  const csv = bom + rows.map(r => r.map(csvCell).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename.endsWith('.csv') ? filename : (filename + '.csv');
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
};

const submissionResultRows = (subs, mode) => {
  const m = ['best', 'avg', 'last'].includes(mode) ? mode : 'best';
  const groups = groupByStudent(markRetryAttempts(subs || []), m)
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'mn'));
  return [
    ['Нэр', 'Анги', 'Хувилбар', 'Эцсийн дүн (%)', 'Оролдлогын тоо', 'Дүнгийн горим', 'Cheat (тоо)', 'Хугацаа', 'Огноо'],
    ...groups.map(g => {
      const r = g.ref || g.attempts[g.attempts.length - 1];
      return [
        g.name || '',
        g.cls || '',
        (r.variantLabel || r.studentVersion || ''),
        g.score,
        g.fullCount || g.attempts.length,
        SCORE_MODE_XLS[m],
        g.attempts.reduce((t, a) => t + (a.cheatLog || []).length, 0),
        (typeof r.timeSpentSec === 'number' ? fmtDur(r.timeSpentSec) : ''),
        (r.submittedAt ? new Date(r.submittedAt).toLocaleString('mn-MN') : '')

const downloadExcelByClass = (baseName, subs, scoreMode) => {
  const byClass = {};
  subs.forEach(s => {
    const cls = (s.studentClass || 'Ангигүй').trim() || 'Ангигүй';
    if (!byClass[cls]) byClass[cls] = [];
    byClass[cls].push(s);
  });
  const classKeys = Object.keys(byClass).sort((a, b) => a.localeCompare(b, 'mn'));
  if (!classKeys.length) return;

  if (typeof XLSX !== 'undefined') {
    const wb = XLSX.utils.book_new();
    classKeys.forEach(cls => {
      const rows = submissionResultRows(byClass[cls], scoreMode);
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const sheetName = cls.replace(/[\\/*?:\[\]]/g, '_').slice(0, 31) || 'Angi';
      XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });
    XLSX.writeFile(wb, (baseName.endsWith('.xlsx') ? baseName : baseName + '.xlsx'));
    return;
  }
  classKeys.forEach(cls => {
    downloadCSV(baseName + '_' + cls.replace(/[\\/:*?"<>|]+/g, '_'), submissionResultRows(byClass[cls], scoreMode));
  });
};

const getExamVariantLabels = (exam) => {
  if (exam?.versions && typeof exam.versions === 'object' && !Array.isArray(exam.versions)) {
    const keys = Object.keys(exam.versions).filter(k => {
      const v = exam.versions[k];
      return Array.isArray(v) && v.length > 0;
    });
    if (keys.length) return keys.sort();
  }
  return normalizeVariants(exam)
    .filter(v => (v.questions || []).some(q => (q.text || '').trim()))
    .map(v => v.label || 'A');
};

const buildExamWithVariant = (roomExam, label) => {
  const labels = getExamVariantLabels(roomExam);
  let questions = [];
  if (roomExam?.versions?.[label]) {
    questions = unpackQuestions(roomExam.versions[label]);
  } else {
    const hit = normalizeVariants(roomExam).find(v => (v.label || 'A') === label);
    questions = hit?.questions || [];
  }
  const variantIndex = Math.max(0, labels.indexOf(label));
  return {
    id: roomExam.roomID || roomExam.id,
    title: roomExam.title,
    subject: roomExam.subject,
    subjectId: roomExam.subjectId,
    duration: roomExam.duration,
    passingScore: roomExam.passingScore,
    omrFormat: roomExam.omrFormat || 'mcq',
    omrMode: roomExam.omrMode || 'mcq',
    stopped: roomExam.stopped,
    maxAttempts: roomExam.maxAttempts > 0 ? roomExam.maxAttempts : 0,
    scoreMode: roomExam.scoreMode || 'best',
    variantLabel: label,
    variantIndex,
    questions
  };
};

/** Тэнцүү хуваарилалт: 2 хувилбар × 10 сурагч → 5A+5B; 3 × 12 → 4A+4B+4C */
const assignBalancedVariant = async (db, roomId, labels, studentName, classKey) => {
  const sorted = (labels || []).filter(Boolean);
  if (!sorted.length) return 'A';
  if (sorted.length === 1) return sorted[0];

  const localBalancedPick = () => {
    const ck = normalizeClassKey(classKey) || 'default';
    const storeKey = 'se_var_counts_' + (roomId || 'x') + '_' + ck;
    let counts = {};
    try { counts = JSON.parse(sessionStorage.getItem(storeKey) || '{}') || {}; } catch { counts = {}; }
    sorted.forEach(l => { if (counts[l] == null) counts[l] = 0; });
    const min = Math.min(...sorted.map(l => counts[l]));
    const pool = sorted.filter(l => counts[l] === min);
    const pick = pool[Math.floor(Math.random() * pool.length)];
    counts[pick] = (counts[pick] || 0) + 1;
    try { sessionStorage.setItem(storeKey, JSON.stringify(counts)); } catch {}
    return pick;
  };

  if (!db || !roomId) return localBalancedPick();

  const ck = normalizeClassKey(classKey) || 'default';
  const key = studentVariantKey(roomId, studentName);
  const studentRef = roomRef(db, roomId).child('variantByStudent').child(ck).child(key);
  const allocRef = roomRef(db, roomId).child('variantAllocator').child(ck);

  try {
    const existingSnap = await studentRef.once('value');
    const existing = existingSnap.val();
    if (existing?.label && sorted.includes(existing.label)) return existing.label;

    const result = await allocRef.transaction(cur => {
      const base = (cur && typeof cur === 'object') ? cur : {};
      const old = { ...(base.counts || {}) };
      sorted.forEach(l => { if (old[l] == null) old[l] = 0; });
      const min = Math.min(...sorted.map(l => Number(old[l]) || 0));
      const pool = sorted.filter(l => (Number(old[l]) || 0) === min);
      const pick = pool[Math.floor(Math.random() * pool.length)];
      return {
        counts: { ...old, [pick]: (Number(old[pick]) || 0) + 1 },
        lastPick: pick,
        updatedAt: Date.now()
      };
    });

    // Compat SDK: Promise resolves to { committed, snapshot } — NOT (result, committed, snap)
    const committed = !!(result && result.committed);
    const snapVal = result?.snapshot?.val?.() || null;
    const pick = snapVal?.lastPick;
    if (!committed || !pick || !sorted.includes(pick)) {
      return localBalancedPick();
    }

    try {
      const authUid = getAuth()?.currentUser?.uid || null;
      await studentRef.set({
        label: pick,
        name: sanitizeText(studentName, 80),
        uid: authUid,
        at: firebase.database.ServerValue.TIMESTAMP
      });
    } catch {
      // Count already reserved; still return pick for this student
    }
    return pick;
  } catch (e) {
    console.warn('variant assign fallback', e);
    return localBalancedPick();
  }
};

const fetchExamRoomByCode = async (code) => {
  const roomId = (code || '').trim();
  if (!roomId) return Promise.reject(new Error('Тестийн код оруулна уу'));
  const db = getDb();
  if (!db) return Promise.reject(new Error('Интернет/Firebase холбогдоогүй. Дахин оролдоно уу.'));

  try {
    // Safari: use data prefetched during Babel compile
    const pre = window.__SE_QR_PREFETCH__;
    if (pre?.promise && pre.roomID === roomId) {
      const got = await pre.promise;
      window.__SE_QR_PREFETCH__ = null;
      if (got?.pack?.versions) {
        if (got.pack.stopped) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
        return normalizeRoomExam(roomId, got.pack);
      }
    }

    await ensureStudentAuth();

    const ref = roomRef(db, roomId);
    // Fast path: one node with everything students need (no answerKeys)
    const packSnap = await ref.child('clientPack').once('value');
    const pack = packSnap.val();
    if (pack?.versions) {
      if (pack.stopped) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
      return normalizeRoomExam(roomId, pack);
    }

    // Legacy rooms (no clientPack yet): few parallel reads only
    const [verSnap, metaSnaps] = await Promise.all([
      ref.child('versions').once('value'),
      Promise.all([
        ref.child('stopped').once('value'),
        ref.child('title').once('value'),
        ref.child('subject').once('value'),
        ref.child('subjectId').once('value'),
        ref.child('duration').once('value'),
        ref.child('passingScore').once('value'),
        ref.child('omrFormat').once('value'),
        ref.child('omrMode').once('value'),
        ref.child('ownerUid').once('value'),
        ref.child('createdAt').once('value'),
        ref.child('roomID').once('value')
      ])
    ]);
    const versions = verSnap.val();
    if (!versions) throw new Error('Тестийн код олдсонгүй. Багшийн өгсөн кодыг яг хуулж оруулна уу.');
    const [stoppedSnap, titleSnap, subjectSnap, subjectIdSnap, durationSnap, passSnap, omrFSnap, omrMSnap, ownerSnap, createdSnap, roomIdSnap] = metaSnaps;
    if (stoppedSnap.val()) throw new Error('Энэ шалгалтыг багш зогсоосон байна.');
    return normalizeRoomExam(roomId, {
      roomID: roomIdSnap.val() || roomId,
      title: titleSnap.val(),
      subject: subjectSnap.val(),
      subjectId: subjectIdSnap.val(),
      duration: durationSnap.val(),
      passingScore: passSnap.val(),
      omrFormat: omrFSnap.val(),
      omrMode: omrMSnap.val(),
      ownerUid: ownerSnap.val(),
      stopped: !!stoppedSnap.val(),
      createdAt: createdSnap.val(),
      versions
    });
  } catch (e) {
    const msg = e?.message || String(e);
    if (/PERMISSION_DENIED|permission.?denied/i.test(msg)) {
      throw new Error('Шалгалт унших зөвшөөрөлгүй. Хуудсаа дахин ачааллаад QR-аа дахин уншуулна уу.');
    }
    throw e;
  }
};
